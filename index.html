/* ---------- Graphe (skill graphe-reseau) ----------
   Scènes : plan d'ensemble (tables par groupe), focus table, focus groupe, constellations par groupe pour un schéma.
   Les éléments d'une scène de focus ou de constellation sont préfixés (k0|t:<clé>) car une table peut figurer
   dans plusieurs constellations ; au plan, la clé d'élément est la clé de la table. */

const svg = $('graph');
const layers = {};
(function initSvg() {
  layers.defs = s('defs', {}, Object.values(RELS).map(r => s('marker', {
    id: 'arrow-' + r.cls, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 8, markerHeight: 8,
    orient: 'auto-start-reverse', markerUnits: 'userSpaceOnUse',
  }, s('path', { d: 'M0,0 L10,5 L0,10 z', class: 'm-' + r.cls }))));
  layers.measure = s('text');
  layers.viewport = s('g');
  for (const name of ['deco', 'edges', 'labels', 'nodes', 'tags']) layers.viewport.append(layers[name] = s('g'));
  svg.append(layers.defs, s('g', { class: 'node measure' }, layers.measure), layers.viewport);
})();

const pos = new Map();      // clé d'élément de la scène courante -> { x, y }
const planPos = new Map();  // positions du plan déplacées à la main (clé de table), non enregistrées avec les données
const view = { x: 0, y: 0, k: 1 };
let scene = null;
let sceneIdentity = null;
let firstFit = true;
let nodeEls = new Map(), edgeEls = [], hullEls = [];
let tweenRaf = 0;
let cardCache = new Map();

// Mesure le texte avec les styles réels d'une carte (classe tname, cname, ctype…).
function measure(text, cls) {
  layers.measure.setAttribute('class', cls);
  layers.measure.textContent = text;
  return layers.measure.getComputedTextLength() || text.length * 7;
}
function truncate(text, cls, max) {
  if (measure(text, cls) <= max) return text;
  let t = text;
  while (t.length > 3 && measure(t + '…', cls) > max) t = t.slice(0, -1);
  return t.trimEnd() + '…';
}

const CARD = { padX: 10, head: 26, row: 17, pad: 6, min: 120 };

// Contenu et taille d'une carte de table (avant agrandissement) selon le réglage « Cartes ».
function cardSize(key) {
  if (cardCache.has(key)) return cardCache.get(key);
  const t = tableByKey(key);
  const fks = fkColumns(key);
  const cols = ui.cards === 'none' ? [] : ui.cards === 'all' ? t.columns : t.columns.filter(c => c.pk || fks.has(c.name));
  const rows = cols.map(c => ({ name: truncate(c.name, 'cname', 150), type: truncate(c.type, 'ctype', 110), tag: c.pk ? 'PK' : fks.has(c.name) ? 'FK' : '' }));
  const hidden = t.columns.length - cols.length;
  const more = ui.cards === 'keys' && hidden ? `+ ${plural(hidden, 'colonne')}` : '';
  const name = truncate(t.name, 'tname', 220);
  const head = (t.schema ? measure(t.schema + '.', 'tname') : 0) + measure(name, 'tname') + (ui.cards === 'none' ? 28 : 0);
  const body = Math.max(0, ...rows.map(r => 24 + measure(r.name, 'cname') + 16 + measure(r.type, 'ctype')), more ? measure(more, 'cmore') : 0);
  const n = rows.length + (more ? 1 : 0);
  const c = { t, name, rows, more, w: Math.ceil(Math.max(CARD.min, head + 2 * CARD.padX + 6, body + 2 * CARD.padX)), h: CARD.head + (n ? n * CARD.row + CARD.pad + 2 : 0) };
  cardCache.set(key, c);
  return c;
}

function edgesFor(ls, keyOf) {
  const edges = [], pairs = new Map(), loops = new Map();
  for (const r of ls) {
    const from = keyOf(r.from.table), to = keyOf(r.to.table);
    if (from === to) {
      const k = loops.get(from) || 0;
      loops.set(from, k + 1);
      edges.push({ kind: 'self', r, from, to, loop: k });
      continue;
    }
    const [lo, hi] = [from, to].sort();
    const pair = lo + '\u0000' + hi;
    if (!pairs.has(pair)) pairs.set(pair, []);
    const e = { kind: 'd', r, from, to, lo, hi, offset: 0 };
    pairs.get(pair).push(e);
    edges.push(e);
  }
  // Plusieurs références entre deux mêmes tables : traits courbés de part et d'autre.
  for (const list of pairs.values()) list.forEach((e, i) => { e.offset = (i - (list.length - 1) / 2) * 30; });
  return edges;
}

/* Graphe éclaté (bouton « Éclater ») : écarts entre cartes agrandis, cartes interchangeables échangées tant que
   cela réduit croisements et traits passant sur une carte, puis chaque trait courbé pour contourner les cartes. */
const spread = (v, k) => (ui.spread ? v * k : v);
const boxOf = (k, p, z, m = 8) => ({ k, x1: p.x - z.w / 2 - m, x2: p.x + z.w / 2 + m, y1: p.y - z.h / 2 - m, y2: p.y + z.h / 2 + m });
const orient = (a, b, c) => Math.sign((b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x));
const segsCross = (a, b, c, d) => orient(a, b, c) * orient(a, b, d) < 0 && orient(c, d, a) * orient(c, d, b) < 0;
// Le segment [a, b] traverse-t-il le rectangle q ? (découpage de Liang-Barsky)
function segHitsBox(a, b, q) {
  let t0 = 0, t1 = 1;
  const dx = b.x - a.x, dy = b.y - a.y;
  for (const [p, v] of [[-dx, a.x - q.x1], [dx, q.x2 - a.x], [-dy, a.y - q.y1], [dy, q.y2 - a.y]]) {
    if (!p) { if (v < 0) return false; continue; }
    const r = v / p;
    if (p < 0) { if (r > t1) return false; t0 = Math.max(t0, r); } else { if (r < t0) return false; t1 = Math.min(t1, r); }
  }
  return true;
}

/* pools : [{ slots, keys, place(slot, key) }], keys[i] occupe slots[i]. Échanges deux à deux, gardés s'ils font
   baisser le coût (croisement = 1, trait sur une carte = 3), dans un budget de calcul fixe (résultat déterministe). */
function untangle(target, size, edges, pools) {
  const links = edges.filter(e => e.kind === 'd');
  const P = k => target.get(k);
  const keys = [...target.keys()];
  const touches = (e, f) => e.from === f.from || e.from === f.to || e.to === f.from || e.to === f.to;
  const hitCost = (e, ks) => ks.reduce((c, k) => c + (k !== e.from && k !== e.to && segHitsBox(P(e.from), P(e.to), boxOf(k, P(k), size(k), 10)) ? 3 : 0), 0);
  let work = 0;
  const cost = moved => {
    const mine = links.filter(e => moved.includes(e.from) || moved.includes(e.to));
    const idx = new Map(mine.map((e, i) => [e, i]));
    let c = 0;
    mine.forEach((e, i) => {
      for (const f of links) if (f !== e && !(idx.get(f) < i) && !touches(e, f) && segsCross(P(e.from), P(e.to), P(f.from), P(f.to))) c++;
      c += hitCost(e, keys);
    });
    for (const e of links) if (!idx.has(e)) c += hitCost(e, moved);
    work += mine.length * (links.length + keys.length) + links.length;
    return c;
  };
  for (let pass = 0; pass < 4; pass++) {
    let better = false;
    for (const pool of pools) for (let i = 0; i < pool.keys.length; i++) for (let j = i + 1; j < pool.keys.length; j++) {
      if (work > 4e6) return;
      const a = pool.keys[i], b = pool.keys[j];
      const swap = () => {
        [pool.keys[i], pool.keys[j]] = [pool.keys[j], pool.keys[i]];
        for (const q of [i, j]) target.set(pool.keys[q], pool.place(pool.slots[q], pool.keys[q]));
      };
      const before = cost([a, b]);
      swap();
      if (cost([a, b]) < before) better = true;
      else swap();
    }
    if (!better) break;
  }
}

// Un trait qui traverserait une carte est courbé du côté le plus dégagé (essais de décalage croissants).
function routeEdges(edges, target, boxes) {
  const tries = [30, -30, 60, -60, 95, -95, 140, -140, ...(ui.spread ? [200, -200, 270, -270, 350, -350] : [])];
  for (const e of edges) {
    if (e.kind !== 'd') continue;
    const a = target.get(e.from), b = target.get(e.to), lo = target.get(e.lo), hi = target.get(e.hi);
    const nx = -(hi.y - lo.y), ny = hi.x - lo.x, nl = Math.hypot(nx, ny) || 1;
    const hits = off => {
      const cx = (a.x + b.x) / 2 + (nx / nl) * off * 2, cy = (a.y + b.y) / 2 + (ny / nl) * off * 2;
      let n = 0;
      for (let i = 1; i < 20; i++) {
        const t = i / 20, u = 1 - t, px = u * u * a.x + 2 * u * t * cx + t * t * b.x, py = u * u * a.y + 2 * u * t * cy + t * t * b.y;
        n += boxes.filter(q => q.k !== e.from && q.k !== e.to && px > q.x1 && px < q.x2 && py > q.y1 && py < q.y2).length;
      }
      return n;
    };
    const base = e.offset;
    let best = base, bestHits = hits(base);
    for (const d of tries) {
      if (!bestHits) break;
      const n = hits(base + d);
      if (n < bestHits) { best = base + d; bestHits = n; }
    }
    e.offset = best;
  }
}

function sceneSpec() {
  const vis = visibleRefs();
  const inSchema = r => !ui.schema || [r.from.table, r.to.table].some(k => schemaOf(tableByKey(k)) === ui.schema);
  const suffix = ui.schema ? ' · ' + ui.schema : '';
  if (ui.focus && tableByKey(ui.focus)) {
    const ls = vis.filter(r => r.from.table === ui.focus || r.to.table === ui.focus);
    return { mode: 'table', items: [{ ls, center: ui.focus, extra: [], title: `Table · ${ui.focus}` }] };
  }
  const g = ui.group && groupByName(ui.group);
  if (g) {
    const keys = new Set(g.tables.filter(tableVisible));
    const ls = vis.filter(r => (keys.has(r.from.table) || keys.has(r.to.table)) && inSchema(r));
    const extra = [...keys].filter(k => !ui.schema || schemaOf(tableByKey(k)) === ui.schema);
    return { mode: 'group', items: [{ ls, center: null, extra, title: `Groupe · ${g.name}${suffix}` }] };
  }
  if (ui.schema) {
    const ofSchema = state.tables.filter(t => schemaOf(t) === ui.schema).map(tableKey).filter(tableVisible);
    const ls = vis.filter(inSchema);
    const items = [...state.groups.map(x => x.name), ''].map(name => {
      const keys = new Set(ofSchema.filter(k => groupName(k) === name));
      const mine = ls.filter(r => keys.has(r.from.table) || keys.has(r.to.table));
      return { ls: mine, center: null, extra: [...keys], title: `${name || 'Sans groupe'}${suffix}` };
    }).filter(x => x.extra.length);
    return { mode: 'schema', items };
  }
  return { mode: 'plan', ls: vis };
}

/* Constellation : la table la plus reliée au centre s'il y en a une nettement, les autres sur un cercle rangé par
   groupe puis par nom. */
function constellation(ls, center, title, pre, extra = []) {
  const keys = [...new Set([...extra, ...ls.flatMap(r => [r.from.table, r.to.table]).filter(tableVisible)])];
  if (center && !keys.includes(center)) keys.unshift(center);
  if (!keys.length) return { nodes: [], edges: [], target: new Map(), titles: [{ x: 0, y: 0, text: title }], R: 120 };
  const deg = new Map(keys.map(k => [k, 0]));
  for (const r of ls) for (const k of new Set([r.from.table, r.to.table])) if (deg.has(k)) deg.set(k, deg.get(k) + 1);
  let hub = center;
  if (!hub && keys.length >= 4) {
    const o = [...keys].sort((a, b) => deg.get(b) - deg.get(a));
    if (deg.get(o[0]) > deg.get(o[1])) hub = o[0];
  }
  const ring = keys.filter(k => k !== hub).sort((a, b) => groupIndex(a) - groupIndex(b) || a.localeCompare(b));
  const n = ring.length;
  const span = ring.reduce((t, k) => { const c = cardSize(k); return t + Math.max(c.w, c.h) + spread(50, 3); }, 0);
  const core = hub ? Math.hypot(cardSize(hub).w, cardSize(hub).h) / 2 : 0;
  const R = Math.max(spread(hub ? 230 : 130, 1.4), span / (2 * Math.PI), core + Math.max(0, ...ring.map(k => cardSize(k).h)) + spread(60, 2));
  const keyOf = k => `${pre}t:${k}`;
  const target = new Map();
  if (hub) target.set(keyOf(hub), { x: 0, y: 0 });
  const slots = ring.map((k, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / (n || 1);
    return n === 1 && !hub ? { x: 0, y: 0 } : { x: R * Math.cos(a), y: R * Math.sin(a) };
  });
  ring.forEach((k, i) => target.set(keyOf(k), { ...slots[i] }));
  const edges = edgesFor(ls.filter(r => deg.has(r.from.table) && deg.has(r.to.table)), keyOf);
  if (ui.spread) {
    const tkOf = new Map(keys.map(k => [keyOf(k), k]));
    const size = key => cardSize(tkOf.get(key));
    untangle(target, size, edges, [{ slots, keys: ring.map(keyOf), place: q => ({ ...q }) }]);
    routeEdges(edges, target, [...target].map(([k, p]) => boxOf(k, p, size(k))));
  }
  const nodes = keys.map(k => ({ key: keyOf(k), tk: k, gid: groupName(k), center: k === hub }));
  const top = Math.min(...[...target.values()].map(p => p.y)) - Math.max(...keys.map(k => cardSize(k).h)) / 2;
  return { nodes, edges, target, titles: [{ x: 0, y: top - 34, text: `${title} — ${plural(ls.length, 'référence')}` }], R: R + 140 };
}

/* Focus table ou groupe, lu de gauche à droite : la table choisie (ou la plus reliée) au centre, les tables qui
   portent les clés étrangères à gauche, les tables référencées à droite ; un-à-un et plusieurs-à-plusieurs suivent
   leurs correspondants. Colonnes ordonnées par barycentres, cartes agrandies selon le nombre de références, traits
   courbés pour contourner les cartes. */
const FLOW_GAP_X = 190, FLOW_GAP_Y = 30;

function flowLayout(ls, title, pre, center = null, extra = []) {
  const keyOf = k => `${pre}t:${k}`;
  const tables = [...new Set([...ls.flatMap(r => [r.from.table, r.to.table]).filter(tableVisible), ...extra])];
  if (center && !tables.includes(center)) tables.unshift(center);
  if (!tables.length) return constellation(ls, center, title, pre, extra);
  const deg = new Map(tables.map(k => [k, 0])), out = new Map(tables.map(k => [k, 0])), inn = new Map(tables.map(k => [k, 0]));
  const links = ls.filter(r => deg.has(r.from.table) && deg.has(r.to.table));
  for (const r of links) {
    for (const k of new Set([r.from.table, r.to.table])) deg.set(k, deg.get(k) + 1);
    if (r.rel === '>' && r.from.table !== r.to.table) { out.set(r.from.table, out.get(r.from.table) + 1); inn.set(r.to.table, inn.get(r.to.table) + 1); }
  }
  const score = k => (out.get(k) + inn.get(k) ? (inn.get(k) - out.get(k)) / (out.get(k) + inn.get(k)) : 0);
  // À égalité de références, le centre revient à la table la plus équilibrée, puis à l'ordre des groupes.
  const hub = center || [...tables].sort((a, b) => deg.get(b) - deg.get(a) || Math.abs(score(a)) - Math.abs(score(b)) || groupIndex(a) - groupIndex(b) || a.localeCompare(b))[0];

  const nb = new Map(tables.map(k => [keyOf(k), []]));
  const peers = new Map(tables.map(k => [k, new Set()]));
  for (const r of links) {
    if (r.from.table === r.to.table) continue;
    nb.get(keyOf(r.from.table)).push(keyOf(r.to.table));
    nb.get(keyOf(r.to.table)).push(keyOf(r.from.table));
    peers.get(r.from.table).add(r.to.table);
    peers.get(r.to.table).add(r.from.table);
  }
  const dist = new Map([[hub, 0]]);
  for (let queue = [hub]; queue.length;) {
    const next = [];
    for (const k of queue) for (const q of peers.get(k)) if (!dist.has(q)) { dist.set(q, dist.get(k) + 1); next.push(q); }
    queue = next;
  }
  // Colonne = côté × distance au centre. Côté : sources à gauche, tables référencées à droite pour les
  // correspondants directs ; au-delà, celui des voisins plus proches du centre, pour qu'aucun trait ne repasse
  // par-dessus lui. Tables sans lien avec le centre (groupe) : côté le moins rempli.
  const col = new Map([[keyOf(hub), 0]]);
  const sideOf = k => Math.sign(col.get(keyOf(k)) || 0);
  const lighter = () => ([...col.values()].filter(c => c < 0).length <= [...col.values()].filter(c => c > 0).length ? -1 : 1);
  const ordered = tables.filter(k => k !== hub).sort((a, b) => (dist.get(a) ?? 1) - (dist.get(b) ?? 1) || Math.abs(score(b)) - Math.abs(score(a)) || deg.get(b) - deg.get(a));
  for (const k of ordered.filter(q => (dist.get(q) ?? 1) === 1)) {
    const lean = [...peers.get(k)].reduce((t, q) => t + sideOf(q), 0);
    col.set(keyOf(k), score(k) ? Math.sign(score(k)) : lean ? Math.sign(lean) : lighter());
  }
  for (const k of ordered.filter(q => !col.has(keyOf(q)))) {
    const d = dist.get(k) ?? 1;
    const lean = [...peers.get(k)].filter(q => col.has(keyOf(q)) && (dist.get(q) ?? 1) < d).reduce((t, q) => t + sideOf(q), 0);
    col.set(keyOf(k), (lean ? Math.sign(lean) : score(k) ? Math.sign(score(k)) : lighter()) * d);
  }

  // Taille des cartes selon le nombre de références.
  const scale = new Map(tables.map(k => {
    const base = clamp(0.95 + 0.08 * deg.get(k), 0.95, 1.4);
    return [keyOf(k), k === hub ? Math.max(1.45, base + 0.1) : base];
  }));
  const size = new Map(tables.map(k => { const c = cardSize(k), z = scale.get(keyOf(k)); return [keyOf(k), { w: c.w * z, h: c.h * z }]; }));

  // Abscisses : colonnes non vides, écartées selon leur carte la plus large.
  const keys = [...col.keys()];
  const cols = [...new Set(col.values())].sort((a, b) => a - b);
  const half = c => Math.max(...keys.filter(k => col.get(k) === c).map(k => size.get(k).w)) / 2;
  const xOf = new Map([[0, 0]]);
  for (const dir of [-1, 1]) {
    let prev = 0;
    for (const c of cols.filter(v => v * dir > 0).sort((a, b) => Math.abs(a) - Math.abs(b))) {
      xOf.set(c, xOf.get(prev) + dir * (half(prev) + half(c) + spread(FLOW_GAP_X, 1.4)));
      prev = c;
    }
  }

  // Ordonnées : balayages par barycentre, chaque colonne empilée sans chevauchement autour de ses cibles.
  const tkOf = new Map(tables.map(k => [keyOf(k), k]));
  const y = new Map([[keyOf(hub), 0]]);
  const members = c => keys.filter(k => col.get(k) === c);
  const stack = (list, want) => {
    const ys = [];
    list.forEach((k, i) => {
      const min = i ? ys[i - 1] + (size.get(list[i - 1]).h + size.get(k).h) / 2 + spread(FLOW_GAP_Y, 3) : -Infinity;
      ys.push(Math.max(want.get(k), min));
    });
    const shift = list.reduce((t, k, i) => t + want.get(k) - ys[i], 0) / list.length;
    list.forEach((k, i) => y.set(k, ys[i] + shift));
  };
  for (const c of cols) {
    if (c === 0) continue;
    const list = members(c).sort((a, b) => groupIndex(tkOf.get(a)) - groupIndex(tkOf.get(b)) || tkOf.get(a).localeCompare(tkOf.get(b)));
    stack(list, new Map(list.map(k => [k, 0])));
  }
  const order = cols.filter(c => c !== 0).sort((a, b) => Math.abs(a) - Math.abs(b));
  for (let it = 0; it < 8; it++) {
    for (const c of it % 2 ? [...order].reverse() : order) {
      const want = new Map(members(c).map(k => {
        const ns = nb.get(k).filter(n => y.has(n));
        return [k, ns.length ? ns.reduce((t, n) => t + y.get(n), 0) / ns.length : y.get(k)];
      }));
      stack(members(c).sort((a, b) => want.get(a) - want.get(b) || y.get(a) - y.get(b)), want);
    }
  }

  const target = new Map(keys.map(k => [k, { x: xOf.get(col.get(k)), y: y.get(k) }]));
  const edges = edgesFor(links, keyOf);
  const boxes = keys.map(k => boxOf(k, target.get(k), size.get(k)));
  routeEdges(edges, target, boxes);
  const nodes = tables.map(k => ({ key: keyOf(k), tk: k, gid: groupName(k), center: k === hub, scale: scale.get(keyOf(k)) }));
  const top = Math.min(...boxes.map(q => q.y1));
  const extent = Math.max(...boxes.map(q => Math.max(Math.abs(q.x1), Math.abs(q.x2), Math.abs(q.y1), Math.abs(q.y2))));
  return { nodes, edges, target, titles: [{ x: 0, y: top - 30, text: `${title} — ${plural(ls.length, 'référence')}` }], R: extent };
}

function buildScene(spec) {
  cardCache = new Map();
  if (spec.mode === 'plan') {
    const nodes = state.tables.map(tableKey).filter(tableVisible).map(k => ({ key: k, tk: k, gid: groupName(k), center: false }));
    const sc = { mode: 'plan', nodes, edges: edgesFor(spec.ls, k => k), titles: [], refs: spec.ls };
    sc.target = planTargets(sc);
    return sc;
  }
  const items = spec.items.length ? spec.items : [{ ls: [], center: null, extra: [], title: 'Aucune table pour cette sélection' }];
  const flow = spec.mode === 'table' || spec.mode === 'group';
  const parts = items.map((it, i) => (flow ? flowLayout(it.ls, it.title, `k${i}|`, it.center, it.extra) : constellation(it.ls, it.center, it.title, `k${i}|`, it.extra)));
  // Grille serrée : chaque colonne et chaque ligne prend la taille de sa plus grande constellation.
  const cols = Math.ceil(Math.sqrt(parts.length));
  const colW = [], rowH = [];
  parts.forEach((p, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    colW[c] = Math.max(colW[c] || 0, 2 * p.R + 120);
    rowH[r] = Math.max(rowH[r] || 0, 2 * p.R + 100);
  });
  const offset = (sizes, i) => sizes.slice(0, i).reduce((t, x) => t + x, 0) + sizes[i] / 2;
  const sc = { mode: spec.mode, nodes: [], edges: [], titles: [], target: new Map(), refs: [...new Set(items.flatMap(it => it.ls))] };
  parts.forEach((p, i) => {
    const ox = parts.length > 1 ? offset(colW, i % cols) : 0, oy = parts.length > 1 ? offset(rowH, Math.floor(i / cols)) : 0;
    sc.nodes.push(...p.nodes);
    sc.edges.push(...p.edges);
    sc.titles.push(...p.titles.map(t => ({ ...t, x: t.x + ox, y: t.y + oy })));
    for (const [k, v] of p.target) sc.target.set(k, { x: v.x + ox, y: v.y + oy });
  });
  return sc;
}

/* Plan d'ensemble : les tables d'un groupe en grille serrée (lignes de la hauteur de leur plus grande carte), les
   groupes sur une grille où les plus liés sont voisins. Une carte déplacée à la main garde sa place (planPos). */
const CELL_GAP_X = 22, CELL_GAP_Y = 26, GROUP_PAD = 16, GROUP_GAP_X = 130, GROUP_GAP_Y = 100;

function planTargets(sc) {
  const byGroup = new Map();
  for (const n of sc.nodes) {
    if (!byGroup.has(n.gid)) byGroup.set(n.gid, []);
    byGroup.get(n.gid).push(n);
  }
  const deg = new Map();
  for (const e of sc.edges) for (const k of new Set([e.from, e.to])) deg.set(k, (deg.get(k) || 0) + 1);

  const blocks = [...state.groups.map(g => g.name), ''].filter(gid => byGroup.has(gid)).map(gid => {
    const ns = byGroup.get(gid).sort((a, b) => (deg.get(b.key) || 0) - (deg.get(a.key) || 0) || a.tk.localeCompare(b.tk));
    const sizes = ns.map(n => cardSize(n.tk));
    const cw = Math.max(...sizes.map(z => z.w)) + spread(CELL_GAP_X, 4);
    const avgH = sizes.reduce((t, z) => t + z.h, 0) / sizes.length + spread(CELL_GAP_Y, 3);
    const cols = Math.max(1, Math.round(Math.sqrt((ns.length * avgH) / cw * 1.6)));
    // Éclaté : lignes de même hauteur, pour que deux cartes du groupe puissent échanger leurs places.
    const maxH = Math.max(...sizes.map(z => z.h));
    const rowH = [];
    ns.forEach((n, k) => { const r = Math.floor(k / cols); rowH[r] = Math.max(rowH[r] || 0, (ui.spread ? maxH : sizes[k].h) + spread(CELL_GAP_Y, 3)); });
    return { gid, ns, sizes, cols, cw, rowH, w: Math.min(cols, ns.length) * cw, h: rowH.reduce((t, x) => t + x, 0) };
  });

  // Placement des groupes : les plus reliés d'abord, chacun sur la case qui le rapproche le plus de ses correspondants.
  const gi = new Map(blocks.map((b, i) => [b.gid, i]));
  const W = blocks.map(() => blocks.map(() => 0));
  for (const r of sc.refs) {
    const a = gi.get(groupName(r.from.table)), b = gi.get(groupName(r.to.table));
    if (a != null && b != null && a !== b) { W[a][b]++; W[b][a]++; }
  }
  const n = blocks.length;
  const gc = Math.max(1, Math.ceil(Math.sqrt(n))), gr = Math.max(1, Math.ceil(n / gc));
  const slots = [];
  for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++) slots.push({ r, c, d: Math.abs(r - (gr - 1) / 2) + Math.abs(c - (gc - 1) / 2) });
  const at = new Map(), used = new Set();
  const total = i => W[i].reduce((t, x) => t + x, 0);
  for (const i of blocks.map((_, i) => i).sort((a, b) => total(b) - total(a) || a - b)) {
    let best = -1, cost = Infinity;
    slots.forEach((slot, k) => {
      if (used.has(k)) return;
      let c = slot.d * 0.01;
      for (const [j, t] of at) c += W[i][j] * (Math.abs(slot.r - t.r) + Math.abs(slot.c - t.c));
      if (c < cost) { cost = c; best = k; }
    });
    used.add(best);
    at.set(i, slots[best]);
  }
  const colW = Array(gc).fill(0), rowH = Array(gr).fill(0);
  for (const [i, slot] of at) { colW[slot.c] = Math.max(colW[slot.c], blocks[i].w); rowH[slot.r] = Math.max(rowH[slot.r], blocks[i].h); }
  const starts = (sizes, gap) => sizes.map((_, k) => sizes.slice(0, k).reduce((t, x) => t + x + gap, 0));
  const colX = starts(colW, spread(GROUP_GAP_X, 1.6)), rowY = starts(rowH, spread(GROUP_GAP_Y, 1.8));
  const offX = (colX[gc - 1] + colW[gc - 1]) / 2, offY = (rowY[gr - 1] + rowH[gr - 1]) / 2;

  const target = new Map(), pools = [];
  const place = (q, key) => ({ x: q.x, y: q.top + cardSize(key).h / 2 });
  for (const [i, slot] of at) {
    const b = blocks[i];
    const cx = colX[slot.c] + colW[slot.c] / 2 - offX, top = rowY[slot.r] + (rowH[slot.r] - b.h) / 2 - offY;
    const slots = b.ns.map((node, k) => {
      const row = Math.floor(k / b.cols), inRow = Math.min(b.cols, b.ns.length - row * b.cols);
      return { x: cx - b.w / 2 + ((Math.min(b.cols, b.ns.length) - inRow) * b.cw) / 2 + b.cw * (k % b.cols + 0.5), top: top + b.rowH.slice(0, row).reduce((t, x) => t + x, 0) };
    });
    b.ns.forEach((node, k) => target.set(node.key, place(slots[k], node.key)));
    // Les cartes déplacées à la main ne participent pas aux échanges.
    const free = b.ns.map((n, k) => k).filter(k => !planPos.has(b.ns[k].key));
    pools.push({ slots: free.map(k => slots[k]), keys: free.map(k => b.ns[k].key), place });
  }
  for (const [k, p] of planPos) if (target.has(k)) target.set(k, { ...p });
  if (ui.spread) {
    untangle(target, cardSize, sc.edges, pools);
    routeEdges(sc.edges, target, [...target].map(([k, p]) => boxOf(k, p, cardSize(k))));
  }
  return target;
}

function tableNode(n) {
  const c = cardSize(n.tk);
  const { t, w, h: hh } = c;
  const scale = n.scale || 1;
  const x0 = -w / 2, y0 = -hh / 2;
  const rowY = i => y0 + CARD.head + CARD.pad / 2 + 2 + CARD.row * i + 12;
  const g = s('g', { class: 'node' + (n.center ? ' center' : ''), 'data-key': n.key, 'data-tk': n.tk },
    s('title', {}, [n.tk, plural(t.columns.length, 'colonne'), n.gid && 'groupe ' + n.gid, t.note].filter(Boolean).join(' — ')),
    s('g', { transform: scale !== 1 ? `scale(${scale})` : null },
      s('rect', { class: 'card', x: x0, y: y0, width: w, height: hh, rx: 5 }),
      c.rows.length || c.more ? [
        s('path', { class: 'head', d: `M${x0 + 0.6},${y0 + CARD.head} V${y0 + 5} q0,-4.4 4.4,-4.4 H${-x0 - 5} q4.4,0 4.4,4.4 V${y0 + CARD.head} Z` }),
        s('line', { class: 'rule', x1: x0, x2: -x0, y1: y0 + CARD.head, y2: y0 + CARD.head }),
      ] : null,
      s('rect', { x: x0 + 3, y: y0 + 4, width: 3, height: (c.rows.length || c.more ? CARD.head : hh) - 8, rx: 1.5, fill: tableColor(t) }),
      s('text', { class: 'tname', x: x0 + CARD.padX + 2, y: y0 + 17 }, t.schema ? s('tspan', { class: 'tschema' }, t.schema + '.') : null, c.name),
      ui.cards === 'none' ? s('text', { class: 'ccount', x: -x0 - CARD.padX, y: y0 + 17 }, t.columns.length) : null,
      c.rows.map((r, i) => [
        r.tag ? s('text', { class: 'ctag' + (r.tag === 'PK' ? ' pk' : ''), x: x0 + CARD.padX, y: rowY(i) }, r.tag) : null,
        s('text', { class: 'cname', x: x0 + CARD.padX + 22, y: rowY(i) }, r.name),
        s('text', { class: 'ctype', x: -x0 - CARD.padX, y: rowY(i) }, r.type),
      ]),
      c.more ? s('text', { class: 'cmore', x: x0 + CARD.padX + 22, y: rowY(c.rows.length) }, c.more) : null));
  g.w = w * scale;
  g.h = hh * scale;
  return g;
}

function edgeElement(e) {
  const r = e.r, rel = relOf(r);
  const marker = `url(#arrow-${rel.cls})`;
  const line = s('path', { class: 'line', 'marker-end': marker, 'marker-start': r.rel !== '>' ? marker : null });
  const g = s('g', { class: `edge rel-${rel.cls}${refNullable(r) ? ' nullable' : ''}`, 'data-rid': r.id },
    s('title', {}, `${r.name ? r.name + ' · ' : ''}${refText(r)} — ${rel.name}`), s('path', { class: 'hit' }), line);
  const labels = [];
  const label = (text, t) => labels.push({ el: s('text', { class: 'elabel' }, text), t });
  if (ui.labels === 'cols') { label(r.from.columns.join(', '), 0.16); label(r.to.columns.join(', '), 0.84); }
  else if (ui.labels === 'names') label(r.name || rel.label, 0.5);
  return { e, g, line, hit: g.querySelector('.hit'), labels };
}

function renderSceneEls() {
  hullEls = scene.mode !== 'plan' ? [] : state.groups
    .filter(g => scene.nodes.some(n => n.gid === g.name))
    .map(g => ({
      gid: g.name,
      shape: s('rect', { class: 'hull', rx: 8, fill: groupColor(g), stroke: groupColor(g), 'data-gid': g.name }),
      label: s('text', { class: 'hull-label' }, s('tspan', { fill: groupColor(g) }, '■ '), g.name.toUpperCase()),
    }));
  fill(layers.deco, hullEls.map(x => x.shape), scene.titles.map(t => s('text', { class: 'scene-title', x: t.x, y: t.y }, t.text)));
  fill(layers.tags, hullEls.map(x => x.label));
  nodeEls = new Map(scene.nodes.map(n => [n.key, tableNode(n)]));
  fill(layers.nodes, [...nodeEls.values()]);
  edgeEls = scene.edges.map(edgeElement);
  fill(layers.edges, edgeEls.map(x => x.g));
  fill(layers.labels, edgeEls.map(x => x.labels.map(lb => lb.el)));

  const ph = $('placeholder');
  ph.hidden = state.tables.length > 0;
  fill(ph, h('strong', {}, 'Aucune table'),
    h('span', {}, ui.edit ? 'Double-cliquez ici pour créer une table, importez un fichier .dbml ou collez du DBML dans l’onglet DBML.' : 'Déverrouillez le cadenas (E) pour importer un fichier .dbml ou créer des tables.'));
  applyHighlight();
}

const toward = (p, tx, ty, d) => {
  const dx = tx - p.x, dy = ty - p.y, l = Math.hypot(dx, dy) || 1;
  return { x: p.x + (dx / l) * d, y: p.y + (dy / l) * d };
};

// Distance du centre au bord de la carte dans la direction (dx, dy).
function boundary(key, dx, dy) {
  const n = nodeEls.get(key);
  if (!n) return 14;
  const l = Math.hypot(dx, dy) || 1, ux = Math.abs(dx / l), uy = Math.abs(dy / l);
  return Math.min(ux ? n.w / 2 / ux : Infinity, uy ? n.h / 2 / uy : Infinity);
}

// Géométrie d'un trait : chemin SVG et point à l'abscisse curviligne t (pour les étiquettes).
function edgeGeom(e) {
  if (e.kind === 'self') {
    const p = pos.get(e.from), n = nodeEls.get(e.from);
    const x = p.x + n.w / 2, L = 46 + 18 * e.loop, dy = Math.min(n.h / 2 - 6, 10 + 6 * e.loop);
    const P = [{ x, y: p.y - dy }, { x: x + L, y: p.y - dy - L * 0.7 }, { x: x + L, y: p.y + dy + L * 0.7 }, { x: x + 1, y: p.y + dy }];
    const at = t => { const u = 1 - t; return ['x', 'y'].map(k => u * u * u * P[0][k] + 3 * u * u * t * P[1][k] + 3 * u * t * t * P[2][k] + t * t * t * P[3][k]); };
    return { d: `M${P[0].x},${P[0].y} C${P[1].x},${P[1].y} ${P[2].x},${P[2].y} ${P[3].x},${P[3].y}`, at };
  }
  const a = pos.get(e.from), b = pos.get(e.to), lo = pos.get(e.lo), hi = pos.get(e.hi);
  // Normale calculée dans un sens canonique pour que les traits parallèles ne se croisent pas.
  const nx = -(hi.y - lo.y), ny = hi.x - lo.x, nl = Math.hypot(nx, ny) || 1;
  const cx = (a.x + b.x) / 2 + (nx / nl) * e.offset * 2;
  const cy = (a.y + b.y) / 2 + (ny / nl) * e.offset * 2;
  const p0 = toward(a, cx, cy, boundary(e.from, cx - a.x, cy - a.y) + (e.r.rel !== '>' ? 3 : 1));
  const p1 = toward(b, cx, cy, boundary(e.to, cx - b.x, cy - b.y) + 3);
  const at = t => { const u = 1 - t; return [u * u * p0.x + 2 * u * t * cx + t * t * p1.x, u * u * p0.y + 2 * u * t * cy + t * t * p1.y]; };
  return { d: `M${p0.x},${p0.y} Q${cx},${cy} ${p1.x},${p1.y}`, at };
}

// Cadre d'un groupe : rectangle ajusté aux cartes de ses tables.
function hullRect(gid, at) {
  const boxes = scene.nodes.filter(n => n.gid === gid).map(n => {
    const p = at(n.key), el = nodeEls.get(n.key);
    return [p.x - el.w / 2, p.y - el.h / 2, p.x + el.w / 2, p.y + el.h / 2];
  });
  return {
    x1: Math.min(...boxes.map(b => b[0])) - GROUP_PAD, y1: Math.min(...boxes.map(b => b[1])) - GROUP_PAD,
    x2: Math.max(...boxes.map(b => b[2])) + GROUP_PAD, y2: Math.max(...boxes.map(b => b[3])) + GROUP_PAD,
  };
}

function drawPositions() {
  for (const [k, g] of nodeEls) { const p = pos.get(k); g.setAttribute('transform', `translate(${p.x},${p.y})`); }
  for (const x of edgeEls) {
    const G = edgeGeom(x.e);
    x.line.setAttribute('d', G.d);
    x.hit.setAttribute('d', G.d);
    // Trait trop court pour deux étiquettes lisibles : elles restent dans l'infobulle.
    const [ax, ay] = G.at(0), [bx, by] = G.at(1);
    const short = x.e.kind === 'd' && x.labels.length > 1 && Math.hypot(bx - ax, by - ay) < 150;
    for (const lb of x.labels) {
      lb.el.style.display = short ? 'none' : '';
      const [lx, ly] = G.at(x.e.kind === 'self' ? (lb.t < 0.5 ? 0.12 : 0.88) : lb.t);
      lb.el.setAttribute('x', lx + (x.e.kind === 'self' ? 18 : 0));
      lb.el.setAttribute('y', ly + 3);
    }
  }
  for (const x of hullEls) {
    const r = hullRect(x.gid, k => pos.get(k));
    x.shape.setAttribute('x', r.x1); x.shape.setAttribute('y', r.y1);
    x.shape.setAttribute('width', r.x2 - r.x1); x.shape.setAttribute('height', r.y2 - r.y1);
    x.label.setAttribute('x', r.x1 + 2); x.label.setAttribute('y', r.y1 - 8);
  }
}

const currentTargets = () => new Map([...pos].map(([k, p]) => [k, { x: p.x, y: p.y }]));

function fitCamera(targets) {
  const W = svg.clientWidth, H = svg.clientHeight;
  if (!W || !scene) return { ...view };
  const boxes = [];
  for (const n of scene.nodes) {
    const t = targets.get(n.key), el = nodeEls.get(n.key);
    boxes.push([t.x - el.w / 2, t.y - el.h / 2, t.x + el.w / 2 + (scene.edges.some(e => e.kind === 'self' && e.from === n.key) ? 70 : 0), t.y + el.h / 2]);
  }
  // Sommet des traits très courbés (contournements du graphe éclaté).
  for (const e of scene.edges) {
    if (e.kind !== 'd' || Math.abs(e.offset) < 100) continue;
    const a = targets.get(e.from), b = targets.get(e.to), lo = targets.get(e.lo), hi = targets.get(e.hi);
    const nx = -(hi.y - lo.y), ny = hi.x - lo.x, nl = Math.hypot(nx, ny) || 1;
    const x = (a.x + b.x) / 2 + (nx / nl) * e.offset, y = (a.y + b.y) / 2 + (ny / nl) * e.offset;
    boxes.push([x - 10, y - 10, x + 10, y + 10]);
  }
  for (const t of scene.titles) boxes.push([t.x - 200, t.y - 22, t.x + 200, t.y + 8]);
  for (const x of hullEls) { const r = hullRect(x.gid, k => targets.get(k)); boxes.push([r.x1, r.y1 - 24, r.x2, r.y2]); }
  if (!boxes.length) return { x: 0, y: 0, k: 1 };
  let minX = Math.min(...boxes.map(b => b[0])), minY = Math.min(...boxes.map(b => b[1]));
  let maxX = Math.max(...boxes.map(b => b[2])), maxY = Math.max(...boxes.map(b => b[3]));
  // Focus : cadrage symétrique autour de la table centrale pour qu'elle reste au milieu de l'écran.
  const hub = (scene.mode === 'table' || scene.mode === 'group') && scene.nodes.find(n => n.center);
  if (hub) {
    const c = targets.get(hub.key), dx = Math.max(c.x - minX, maxX - c.x), dy = Math.max(c.y - minY, maxY - c.y);
    [minX, maxX, minY, maxY] = [c.x - dx, c.x + dx, c.y - dy, c.y + dy];
  }
  const k = clamp(Math.min(W / (maxX - minX + 60), H / (maxY - minY + 60)), 0.2, 1.4);
  return { k, x: -((minX + maxX) / 2) * k, y: -((minY + maxY) / 2) * k };
}

function applyView() {
  layers.viewport.setAttribute('transform', `translate(${svg.clientWidth / 2 + view.x},${svg.clientHeight / 2 + view.y}) scale(${view.k})`);
  const z = $('zoom');
  if (z) z.textContent = Math.round(view.k * 100) + ' %';
}

// Transition entre deux scènes : chaque élément glisse de sa position actuelle vers sa cible, caméra comprise.
function tweenTo(targets, cam) {
  cancelAnimationFrame(tweenRaf);
  const from = currentTargets();
  const cam0 = { ...view };
  const dur = reduceMotion() ? 0 : 560;
  const t0 = performance.now();
  const step = now => {
    const t = dur ? Math.min(1, (now - t0) / dur) : 1;
    const e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    for (const [k, to] of targets) {
      const p = pos.get(k), f = from.get(k) || to;
      if (!p) continue;
      p.x = f.x + (to.x - f.x) * e;
      p.y = f.y + (to.y - f.y) * e;
    }
    if (cam) {
      view.k = cam0.k + (cam.k - cam0.k) * e;
      view.x = cam0.x + (cam.x - cam0.x) * e;
      view.y = cam0.y + (cam.y - cam0.y) * e;
      applyView();
    }
    drawPositions();
    if (t < 1) tweenRaf = requestAnimationFrame(step);
  };
  step(t0);
}

const recenter = () => tweenTo(scene.target, fitCamera(scene.target));

function renderGraph() {
  const spec = sceneSpec();
  const identity = JSON.stringify([spec.mode, ui.focus, ui.group, ui.schema]);
  const changed = identity !== sceneIdentity;
  // Point de départ de l'animation : position actuelle de la même table dans la scène précédente.
  const prev = new Map(pos);
  const prevByTk = new Map();
  if (scene) for (const n of scene.nodes) if (!prevByTk.has(n.tk) && pos.has(n.key)) prevByTk.set(n.tk, pos.get(n.key));
  scene = buildScene(spec);
  sceneIdentity = identity;
  pos.clear();
  for (const n of scene.nodes) {
    const t = scene.target.get(n.key);
    const p = changed ? prevByTk.get(n.tk) || t : prev.get(n.key) || prevByTk.get(n.tk) || t;
    pos.set(n.key, { x: p.x, y: p.y });
  }
  renderSceneEls();
  applyView();
  drawPositions();
  if (firstFit) {
    Object.assign(view, fitCamera(scene.target));
    for (const [k, t] of scene.target) Object.assign(pos.get(k), t);
    applyView();
    drawPositions();
    firstFit = !svg.clientWidth;
  } else if (changed) {
    tweenTo(scene.target, fitCamera(scene.target));
  }
}

function toWorld(e) {
  const r = svg.getBoundingClientRect();
  return { x: (e.clientX - r.left - r.width / 2 - view.x) / view.k, y: (e.clientY - r.top - r.height / 2 - view.y) / view.k };
}

// Sélection : l'élément choisi et ses voisins restent nets, le reste passe à 13 % d'opacité.
function applyHighlight() {
  if (!scene) return;
  const sel = ui.selected;
  let tks = null, rids = null;
  const around = seed => {
    tks = new Set(seed);
    rids = new Set();
    for (const r of scene.refs) if (seed.includes(r.from.table) || seed.includes(r.to.table)) { rids.add(r.id); tks.add(r.from.table); tks.add(r.to.table); }
  };
  if (sel?.type === 'table') around([sel.id]);
  else if (sel?.type === 'group') around(groupByName(sel.id)?.tables || []);
  else if (sel?.type === 'ref') {
    const r = refById(sel.id);
    tks = new Set(r ? [r.from.table, r.to.table] : []);
    rids = new Set(r ? [r.id] : []);
  }
  for (const n of scene.nodes) {
    const g = nodeEls.get(n.key);
    g.classList.toggle('dim', !!tks && !tks.has(n.tk));
    g.classList.toggle('selected', sel?.type === 'table' && sel.id === n.tk && !n.center);
  }
  for (const x of edgeEls) {
    const off = !!rids && !rids.has(x.e.r.id);
    x.g.classList.toggle('dim', off);
    x.g.classList.toggle('selected', sel?.type === 'ref' && sel.id === x.e.r.id);
    x.labels.forEach(lb => lb.el.classList.toggle('dim', off));
  }
  for (const x of hullEls) x.shape.classList.toggle('focus', sel?.type === 'group' && sel.id === x.gid);
}

/* Souris dans le graphe. Lecture seule : glisser une carte la déplace, glisser le fond déplace la vue.
   Édition : glisser d'une table à une autre crée une référence (Maj + glisser déplace la carte), double-cliquer
   sur le fond crée une table (dans le groupe sous le pointeur), double-cliquer sur une carte la modifie. */
let drag = null;
let clickTimer = 0;
const nodeAt = e => document.elementFromPoint(e.clientX, e.clientY)?.closest('#graph .node');

// Préremplissage d'une référence tracée de a vers b : colonnes de la clé primaire de b, et colonnes de a qui
// portent leur nom habituel de clé étrangère (commande_id, commandeId…) s'il y en a.
function refPreset(a, b) {
  const ta = tableByKey(a), tb = tableByKey(b);
  const pk = tb.columns.filter(c => c.pk).map(c => c.name);
  const to = pk.length ? pk : tb.columns.slice(0, 1).map(c => c.name);
  const stems = [...new Set([tb.name, tb.name.replace(/ies$/, 'y').replace(/s$/, '')])];
  const guess = col => {
    const names = stems.flatMap(st => [`${st}_${col}`, `${st}${col[0].toUpperCase()}${col.slice(1)}`]);
    return ta.columns.find(c => names.includes(c.name) && !(a === b && c.name === col))?.name;
  };
  const from = to.map(guess);
  return { from: { table: a, columns: from.every(Boolean) ? from : [] }, to: { table: b, columns: to } };
}

svg.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const item = e.target.closest('.node');
  const edge = e.target.closest('.edge');
  const hull = e.target.closest('.hull');
  try { svg.setPointerCapture(e.pointerId); } catch (_) { /* pointeur synthétique */ }
  cancelAnimationFrame(tweenRaf);
  drag = {
    key: item?.dataset.key, tk: item?.dataset.tk, rid: edge?.dataset.rid, gid: hull?.dataset.gid,
    sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false,
    link: ui.edit && !!item && !e.shiftKey,
  };
  if (drag.link) {
    drag.line = s('path', { class: 'draft-link' });
    layers.tags.append(drag.line);
  } else if (!drag.key) svg.classList.add('panning');
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (Math.hypot(dx, dy) > 3) drag.moved = true;
  if (!drag.moved) return;
  if (drag.link) {
    const from = pos.get(drag.key), to = toWorld(e);
    drag.line.setAttribute('d', `M${from.x},${from.y} L${to.x},${to.y}`);
    const target = nodeAt(e);
    for (const g of nodeEls.values()) g.classList.toggle('drop', g === target);
  } else if (drag.key) {
    Object.assign(pos.get(drag.key), toWorld(e));
    if (scene.mode === 'plan') planPos.set(drag.key, toWorld(e));
    drawPositions();
  } else {
    view.x = drag.vx + dx;
    view.y = drag.vy + dy;
    applyView();
  }
});
function endDrag(e) {
  if (!drag) return;
  svg.classList.remove('panning');
  if (drag.link) {
    drag.line.remove();
    for (const g of nodeEls.values()) g.classList.remove('drop');
    // Relâcher sur une carte (la même comprise : référence réflexive) ouvre l'éditeur de référence prérempli.
    const target = drag.moved && e?.type === 'pointerup' ? nodeAt(e)?.dataset.tk : null;
    if (target) {
      const [a, b] = [drag.tk, target];
      drag = null;
      openRefEditor(null, refPreset(a, b));
      return;
    }
  }
  if (!drag.moved) {
    clearTimeout(clickTimer);
    if (drag.tk && ui.edit) { const tk = drag.tk; clickTimer = setTimeout(() => focusTable(tk), 260); }
    else if (drag.tk) focusTable(drag.tk);
    else if (drag.rid) select({ type: 'ref', id: drag.rid });
    else if (drag.gid) select({ type: 'group', id: drag.gid });
    else select(null);
  }
  drag = null;
}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('dblclick', e => {
  const tk = e.target.closest('.node')?.dataset.tk;
  if (ui.edit && tk) {
    clearTimeout(clickTimer);
    openTableEditor(tableByKey(tk));
    return;
  }
  if (!ui.edit || e.target.closest('.node, .edge')) return;
  const at = toWorld(e);
  const gid = e.target.closest('.hull')?.dataset.gid || '';
  openTableEditor(null, { group: gid }, key => {
    // Hors d'un groupe, la nouvelle table reste là où l'on a double-cliqué ; dans un groupe, elle rejoint sa grille.
    if (!gid && scene?.mode === 'plan') planPos.set(key, at);
    if (scene?.mode !== 'plan') { ui.focus = null; ui.group = ''; ui.schema = ''; }
    ui.selected = { type: 'table', id: key };
  });
});
svg.addEventListener('wheel', e => {
  e.preventDefault();
  cancelAnimationFrame(tweenRaf);
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left - r.width / 2, my = e.clientY - r.top - r.height / 2;
  const k = clamp(view.k * Math.exp(-e.deltaY * 0.0015), 0.15, 4);
  view.x = mx - (mx - view.x) * (k / view.k);
  view.y = my - (my - view.y) * (k / view.k);
  view.k = k;
  applyView();
}, { passive: false });

/* ---------- Modifications (refusées hors édition) ---------- */

// Renomme une table partout où sa clé apparaît (références, groupes, positions, interface).
function moveTableKey(oldKey, newKey) {
  if (oldKey === newKey) return;
  for (const r of state.refs) for (const end of [r.from, r.to]) if (end.table === oldKey) end.table = newKey;
  for (const g of state.groups) g.tables = g.tables.map(k => (k === oldKey ? newKey : k));
  if (planPos.has(oldKey)) { planPos.set(newKey, planPos.get(oldKey)); planPos.delete(oldKey); }
  if (ui.focus === oldKey) ui.focus = newKey;
  if (ui.selected?.type === 'table' && ui.selected.id === oldKey) ui.selected.id = newKey;
}

function removeTable(key) {
  if (!ui.edit) return;
  const n = refsOf(key).length;
  if (!confirm(`Supprimer la table ${key}${n ? ` et ses ${plural(n, 'référence')}` : ''} ?`)) return;
  state.tables = state.tables.filter(t => tableKey(t) !== key);
  state.refs = state.refs.filter(r => r.from.table !== key && r.to.table !== key);
  for (const g of state.groups) g.tables = g.tables.filter(k => k !== key);
  planPos.delete(key);
  cleanUi();
  commit();
}
function removeRef(id) {
  if (!ui.edit) return;
  const r = refById(id);
  if (!r || !confirm(`Supprimer la référence ${refText(r)} ?`)) return;
  state.refs = state.refs.filter(x => x !== r);
  cleanUi();
  commit();
}
function removeGroup(name) {
  if (!ui.edit) return;
  if (!confirm(`Supprimer le groupe ${name} ? Ses tables sont conservées, sans groupe.`)) return;
  state.groups = state.groups.filter(g => g.name !== name);
  ui.hideGroups.delete(name);
  cleanUi();
  commit();
}

/* ---------- Éditeurs ---------- */

const field = (label, control) => h('label', { class: 'field' }, label, control);
const IDENT_RE = /^[^\s."'`\[\]{}():,<>]+$/u;
// Valeur par défaut : 'texte', `expression` ou valeur brute (nombre, true, null…).
const defaultText = d => (d ? qval(d) : '');
function parseDefault(text) {
  const v = text.trim();
  if (!v) return null;
  if (/^'.*'$/s.test(v)) return { kind: 'str', v: v.slice(1, -1).replace(/\\(.)/g, '$1') };
  if (/^`.*`$/s.test(v)) return { kind: 'expr', v: v.slice(1, -1) };
  return { kind: 'raw', v };
}

function openDialog(title, body, onSubmit, narrow) {
  const dialog = $('editor'), form = $('editorForm');
  const error = h('div', { class: 'form-error', role: 'alert' });
  dialog.classList.toggle('narrow', !!narrow);
  fill(form,
    h('h2', {}, title),
    body,
    error,
    h('div', { class: 'form-actions' },
      h('button', { type: 'button', class: 'btn', onclick: () => dialog.close() }, 'Annuler'),
      h('button', { type: 'submit', class: 'btn primary' }, 'Enregistrer')));
  form.onsubmit = e => {
    e.preventDefault();
    const msg = onSubmit();
    if (msg) { error.textContent = msg; return; }
    dialog.close();
  };
  if (!dialog.open) dialog.showModal();
  return form;
}

const COMMON_TYPES = ['integer', 'bigint', 'smallint', 'serial', 'decimal(10, 2)', 'numeric', 'real', 'boolean', 'varchar(255)', 'text', 'char(2)', 'uuid', 'date', 'timestamp', 'timestamptz', 'json', 'jsonb'];

// `onCreate(clé)` est appelé après la création d'une table, avant le rendu.
function openTableEditor(t, preset = {}, onCreate = null) {
  if (!ui.edit) return;
  const oldKey = t ? tableKey(t) : null;
  const blank = () => ({ name: '', type: 'integer', pk: false, increment: false, notNull: false, unique: false, default: null, note: '', _orig: null });
  const d = t
    ? { name: t.name, schema: t.schema, color: t.color, note: t.note, group: groupName(oldKey), columns: t.columns.map(c => ({ ...c, default: c.default && { ...c.default }, _orig: c.name })) }
    : { name: '', schema: preset.schema || '', color: '', note: '', group: preset.group || '', columns: [{ ...blank(), name: 'id', pk: true, increment: true }] };
  const types = [...new Set([...COMMON_TYPES, ...state.enums.map(e => (e.schema ? e.schema + '.' : '') + e.name)])];
  const wrap = h('div', { class: 'cols-wrap' });
  const text = (value, oninput, attrs = {}) => h('input', { type: 'text', class: 'mono', value, oninput: e => oninput(e.target.value), ...attrs });
  const check = (on, onchange, title) => h('input', { type: 'checkbox', checked: on, title, 'aria-label': title, onchange: e => onchange(e.target.checked) });
  const move = (i, j) => { const [c] = d.columns.splice(i, 1); d.columns.splice(j, 0, c); drawCols(); };
  function drawCols() {
    fill(wrap, h('table', { class: 'cols' },
      h('thead', {}, h('tr', {}, ['Nom', 'Type', 'PK', 'Inc.', 'Non nul', 'Unique', 'Défaut', 'Note', ''].map(x =>
        h('th', { title: x === 'Défaut' ? "'texte', `expression` ou valeur brute (0, true, null)" : null }, x)))),
      h('tbody', {}, d.columns.map((c, i) => h('tr', {},
        h('td', {}, text(c.name, v => { c.name = v.trim(); }, { 'aria-label': 'Nom de la colonne', placeholder: 'nom' })),
        h('td', {}, text(c.type, v => { c.type = v.trim(); }, { list: 'dbviz-types', 'aria-label': 'Type' })),
        h('td', { class: 'cb' }, check(c.pk, v => { c.pk = v; }, 'Clé primaire')),
        h('td', { class: 'cb' }, check(c.increment, v => { c.increment = v; }, 'Auto-incrément')),
        h('td', { class: 'cb' }, check(c.notNull, v => { c.notNull = v; }, 'Non nul')),
        h('td', { class: 'cb' }, check(c.unique, v => { c.unique = v; }, 'Unique')),
        h('td', {}, text(defaultText(c.default), v => { c.default = parseDefault(v); }, { 'aria-label': 'Valeur par défaut' })),
        h('td', {}, text(c.note, v => { c.note = v; }, { 'aria-label': 'Note' })),
        h('td', { style: 'white-space:nowrap' },
          h('button', { type: 'button', class: 'icon', title: 'Monter', disabled: i === 0, onclick: () => move(i, i - 1) }, '↑'),
          h('button', { type: 'button', class: 'icon', title: 'Descendre', disabled: i === d.columns.length - 1, onclick: () => move(i, i + 1) }, '↓'),
          h('button', { type: 'button', class: 'icon danger', title: 'Retirer la colonne', onclick: () => { d.columns.splice(i, 1); drawCols(); } }, '✕')))))));
  }
  drawCols();
  const form = openDialog(t ? `Modifier la table ${oldKey}` : 'Nouvelle table', [
    h('div', { class: 'fields' },
      field('Nom', h('input', { class: 'mono', value: d.name, required: true, oninput: e => { d.name = e.target.value.trim(); } })),
      field('Schéma', h('input', { class: 'mono', value: d.schema, placeholder: 'public', oninput: e => { d.schema = e.target.value.trim(); } })),
      field('Groupe', h('select', { onchange: e => { d.group = e.target.value; } },
        h('option', { value: '' }, '— aucun —'), state.groups.map(g => h('option', { value: g.name, selected: g.name === d.group }, g.name)))),
      field('Couleur d’en-tête', h('input', { class: 'mono', value: d.color, placeholder: '#1f8a9e', oninput: e => { d.color = e.target.value.trim(); } }))),
    field('Note', h('textarea', { oninput: e => { d.note = e.target.value; } }, d.note)),
    h('div', { class: 'dhead' }, h('span', { class: 'label grow' }, 'Colonnes'),
      h('button', { type: 'button', class: 'btn small', onclick: () => { d.columns.push(blank()); drawCols(); wrap.querySelector('tbody tr:last-child input')?.focus(); } }, '+ Colonne')),
    wrap,
    h('datalist', { id: 'dbviz-types' }, types.map(x => h('option', { value: x }))),
  ], () => {
    if (!d.name || !IDENT_RE.test(d.name)) return 'Nom de table invalide (pas d’espace, de point ni de guillemet).';
    if (d.schema && !IDENT_RE.test(d.schema)) return 'Nom de schéma invalide.';
    if (d.schema === 'public') d.schema = '';
    const key = (d.schema ? d.schema + '.' : '') + d.name;
    if (key !== oldKey && tableByKey(key)) return `La table ${key} existe déjà.`;
    if (d.color && !/^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(d.color)) return 'Couleur attendue au format #rgb ou #rrggbb.';
    if (!d.columns.length) return 'Une table doit avoir au moins une colonne.';
    const names = new Set();
    for (const c of d.columns) {
      if (!c.name || !IDENT_RE.test(c.name)) return `Nom de colonne invalide : « ${c.name} ».`;
      if (names.has(c.name)) return `Colonne en double : ${c.name}.`;
      names.add(c.name);
      if (!c.type || /[\[\]\n{}]/.test(c.type)) return `Type invalide pour la colonne ${c.name}.`;
    }
    // Colonnes retirées : les références qui les utilisaient sont supprimées, après confirmation.
    const renamed = new Map(d.columns.filter(c => c._orig).map(c => [c._orig, c.name]));
    const broken = oldKey ? state.refs.filter(r => [r.from, r.to].some(end => end.table === oldKey && !end.columns.every(c => renamed.has(c)))) : [];
    if (broken.length && !confirm(`${plural(broken.length, 'référence')} ${broken.length > 1 ? 'utilisaient' : 'utilisait'} une colonne retirée et ${broken.length > 1 ? 'seront supprimées' : 'sera supprimée'}. Continuer ?`)) return 'Enregistrement annulé.';
    const columns = d.columns.map(({ _orig, ...c }) => c);
    if (t) {
      state.refs = state.refs.filter(r => !broken.includes(r));
      for (const r of state.refs) for (const end of [r.from, r.to]) if (end.table === oldKey) end.columns = end.columns.map(c => renamed.get(c));
      Object.assign(t, { name: d.name, schema: d.schema, color: d.color, note: d.note, columns });
      moveTableKey(oldKey, key);
    } else {
      state.tables.push({ id: nextId('T', state.tables), schema: d.schema, name: d.name, alias: '', color: d.color, note: d.note, columns, indexes: '' });
    }
    if (groupName(key) !== d.group) {
      for (const g of state.groups) g.tables = g.tables.filter(k => k !== key);
      if (d.group) groupByName(d.group).tables.push(key);
    }
    if (!t) onCreate?.(key);
    commit();
  });
  form.querySelector('input')?.focus();
}

function openRefEditor(r, preset = {}) {
  if (!ui.edit || !state.tables.length) return;
  const first = tableKey(state.tables[0]);
  const d = r
    ? { name: r.name, rel: r.rel, onDelete: r.onDelete, onUpdate: r.onUpdate, from: { ...r.from, columns: [...r.from.columns] }, to: { ...r.to, columns: [...r.to.columns] } }
    : { name: '', rel: '>', onDelete: '', onUpdate: '', from: preset.from || { table: first, columns: [] }, to: preset.to || { table: first, columns: [] } };
  const body = h('div', { style: 'display:grid; gap:12px' });
  const preview = h('pre', { class: 'preview' });
  const cols = list => list.split(',').map(x => x.trim()).filter(Boolean);
  const showPreview = () => {
    const end = e => ({ table: e.table, columns: e.columns.length ? e.columns : ['?'] });
    const opts = [d.onDelete && `delete: ${d.onDelete}`, d.onUpdate && `update: ${d.onUpdate}`].filter(Boolean);
    preview.textContent = `Ref${d.name ? ' ' + qid(d.name) : ''}: ${qend(end(d.from))} ${d.rel} ${qend(end(d.to))}${opts.length ? ` [${opts.join(', ')}]` : ''}`;
  };
  const side = (label, end, listId) => {
    const t = tableByKey(end.table);
    return h('div', { class: 'fields' },
      field(label, h('select', { class: 'mono', onchange: e => {
        end.table = e.target.value;
        if (end === d.to) Object.assign(d.to, refPreset(d.from.table, d.to.table).to);
        Object.assign(d.from, { columns: refPreset(d.from.table, d.to.table).from.columns });
        draw();
      } }, state.tables.map(x => h('option', { value: tableKey(x), selected: tableKey(x) === end.table }, tableKey(x))))),
      field('Colonnes (séparées par des virgules)', h('input', { class: 'mono', list: listId, value: end.columns.join(', '), oninput: e => { end.columns = cols(e.target.value); showPreview(); } })),
      h('datalist', { id: listId }, (t?.columns || []).map(c => h('option', { value: c.name }))));
  };
  const actionSelect = (label, key) => field(label, h('select', { class: 'mono', onchange: e => { d[key] = e.target.value; showPreview(); } },
    ACTIONS.map(a => h('option', { value: a, selected: a === d[key] }, a || '— par défaut —'))));
  function draw() {
    fill(body,
      side('Table source (porte la clé étrangère)', d.from, 'dbviz-from-cols'),
      h('div', { class: 'fields' },
        field('Cardinalité', h('select', { onchange: e => { d.rel = e.target.value; showPreview(); } },
          Object.entries(RELS).map(([k, v]) => h('option', { value: k, selected: k === d.rel }, `${k}  ${v.label} · ${v.name}`)))),
        field('Nom (facultatif)', h('input', { class: 'mono', value: d.name, oninput: e => { d.name = e.target.value.trim(); showPreview(); } }))),
      side('Table référencée', d.to, 'dbviz-to-cols'),
      h('div', { class: 'fields' }, actionSelect('ON DELETE', 'onDelete'), actionSelect('ON UPDATE', 'onUpdate')),
      preview);
    showPreview();
  }
  draw();
  openDialog(r ? 'Modifier la référence' : 'Nouvelle référence', body, () => {
    for (const [label, end] of [['source', d.from], ['référencée', d.to]]) {
      const t = tableByKey(end.table);
      if (!t) return `Table ${label} inconnue.`;
      if (!end.columns.length) return `Indiquez les colonnes de la table ${label}.`;
      const missing = end.columns.filter(c => !t.columns.some(x => x.name === c));
      if (missing.length) return `Colonne inconnue dans ${end.table} : ${missing.join(', ')}.`;
    }
    if (d.from.columns.length !== d.to.columns.length) return 'Les deux côtés doivent avoir le même nombre de colonnes.';
    if (d.name && !IDENT_RE.test(d.name)) return 'Nom de référence invalide.';
    if (r) Object.assign(r, d);
    else {
      const created = { id: nextId('R', state.refs), ...d, line: 0 };
      state.refs.push(created);
      ui.selected = { type: 'ref', id: created.id };
    }
    commit();
  }, true);
}

  ], () => {

/* ---------- Import / export ---------- */

function importDbml() {
  if (!ui.edit) return;
  $('file').value = '';
  $('file').click();
}
$('file').addEventListener('change', async () => {
  const f = $('file').files[0];
  if (!f || !ui.edit) return;
  if (f.size > MAX_IMPORT) { toast('Fichier trop volumineux (5 Mo au plus)', true); return; }
  try {
    replaceState(normalize(parseDbml(await f.text())));
    ui.srcDraft = null;
    toast(`${f.name} importé : ${plural(state.tables.length, 'table')}, ${plural(state.refs.length, 'référence')}`);
  } catch (err) {
    toast(err instanceof DbmlError ? 'Import impossible. ' + err.message : 'Import impossible : fichier illisible', true);
  }
});

function loadSample() {
  if (!ui.edit || !SAMPLE) return;
  ui.srcDraft = null;
  replaceState(normalize(parseDbml(SAMPLE)));
}

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportDbml() {
  const base = state.project?.name || 'modele';
  download(base.replace(/[^\p{L}\p{N}_-]+/gu, '_') + '.dbml', toDbml(state), 'text/plain;charset=utf-8');
}

// Applique le texte de l'onglet DBML au modèle (édition seulement).
function applySource() {
  if (!ui.edit || ui.srcDraft == null) return;
  try {
    const m = normalize(parseDbml(ui.srcDraft));
    ui.srcDraft = null;
    ui.srcError = '';
    replaceState(m);
    renderSource(true);
    toast('DBML appliqué');
  } catch (err) {
    ui.srcError = err instanceof DbmlError ? err.message : 'DBML illisible';
    renderSource(true);
    const ta = $('source').querySelector('textarea');
    if (err.line && ta) {
      const lines = ta.value.split('\n');
      const start = lines.slice(0, err.line - 1).reduce((t, l) => t + l.length + 1, 0);
      ta.focus();
      ta.setSelectionRange(start, start + (lines[err.line - 1] || '').length);
    }
  }
}
function copySource() {
  const ta = $('source').querySelector('textarea');
  const done = () => toast('DBML copié dans le presse-papiers');
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); document.execCommand('copy'); done(); });
  else { ta.select(); document.execCommand('copy'); done(); }
}

  ta.value = ui.srcDraft ?? toDbml(state);
  ta.addEventListener('input', () => { ui.srcDraft = ta.value; ui.srcError = ''; });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); applySource(); }
    if (e.key === 'Tab' && !e.shiftKey && ui.edit) { e.preventDefault(); ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end'); ui.srcDraft = ta.value; }
  });
  fill(pane,
    h('div', { class: 'srcbar' },
      h('span', { class: 'label' }, ui.srcDraft != null ? 'DBML · modifié' : 'DBML'),
      h('span', { class: 'grow' }),
      ui.edit && ui.srcDraft != null ? h('button', { class: 'btn small', type: 'button', onclick: () => { ui.srcDraft = null; ui.srcError = ''; renderSource(true); } }, 'Rétablir') : null,
      editBtn('Appliquer', applySource, 'primary', 'Remplacer le modèle par ce texte (Ctrl+Entrée)'),
      h('button', { class: 'btn small', type: 'button', onclick: copySource }, 'Copier')),
    ta,
    ui.srcError ? h('div', { class: 'src-error', role: 'alert' }, ui.srcError) : null);
}

function renderStatus() {
  const nCols = state.tables.reduce((n, t) => n + t.columns.length, 0);
  fill($('status'),
    h('span', {}, `${plural(state.tables.length, 'table')} · ${plural(nCols, 'colonne')} · ${plural(state.refs.length, 'référence')} · ${plural(state.groups.length, 'groupe')}`),
    issues.length ? h('span', { class: 'warn' }, `⚠ ${plural(issues.length, 'avertissement')}`) : null,
    h('span', { class: 'grow' }),
    h('span', {}, 'zoom ', h('span', { id: 'zoom' }, Math.round(view.k * 100) + ' %')),
    h('span', { class: 'mode' + (ui.edit ? ' on' : '') }, ui.edit ? 'ÉDITION' : 'LECTURE SEULE'));
}

function renderAll() {
  renderHeader();
  renderGraph();
  renderContextBar();
  renderToolbar();
  renderTabs();
  renderDetail();
  renderSource();
  renderStatus();
}

/* ---------- Clavier ---------- */

document.addEventListener('keydown', e => {
  if (editorIsOpen()) return;
  if (e.key.toLowerCase() === 'e' && !e.ctrlKey && !e.metaKey && !e.altKey && !e.repeat && !typing(e)) {
    e.preventDefault();
    setEditMode(!ui.edit);
    return;
  }
  if (e.key.toLowerCase() === 'z' && (e.ctrlKey || e.metaKey) && !e.shiftKey && ui.edit && !typing(e)) { e.preventDefault(); undo(); return; }
  if (e.key === '/' && !typing(e)) { e.preventDefault(); $('search')?.focus(); return; }
  if (e.key !== 'Escape') return;
  const open = $('toolbar').querySelector('details[open]');
  if (open) { open.open = false; return; }
  if (typing(e)) { e.target.blur(); return; }
  if (ui.selected) select(null);
  else if (ui.focus || ui.group || ui.schema) backToPlan();
});
// Un clic hors d'un panneau d'outils le referme.
document.addEventListener('pointerdown', e => {
  for (const d of document.querySelectorAll('details.pop[open]')) if (!d.contains(e.target)) d.open = false;
});
window.addEventListener('resize', applyView);

load();
renderAll();
</script>
</body>
</html>
