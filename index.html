<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Hors ligne garanti : aucune ressource externe ni requête réseau, même si une donnée importée tentait d'en provoquer. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>DBViz</title>
<style>
/* Outil de développeur : bandeau, barre de contexte et d'outils, graphe | panneau (Détail / DBML), barre d'état.
   Polices système uniquement (hors ligne) ; identifiants en chasse fixe. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --ink: #1c2128; --muted: #636c76; --line: #d8dee4; --line-2: #e7ebef;
  --accent: #0969da; --accent-ink: #ffffff; --accent-soft: #ddf0ff;
  --canvas: #fbfcfd; --grid: rgba(28, 33, 40, .09);
  --ok: #1a7f37; --warn: #9a6700; --warn-soft: #fff4c2; --err: #cf222e; --err-soft: #ffebe9;
  --rel-n1: #5b6b7f; --rel-11: #1a7f37; --rel-nn: #8250df;
  --f-body: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --surface: #151b23; --surface-2: #1c232c; --ink: #e6edf3; --muted: #8d96a0; --line: #2d353f; --line-2: #222a33;
    --accent: #4493f8; --accent-ink: #051325; --accent-soft: #11294a;
    --canvas: #0f141a; --grid: rgba(255, 255, 255, .07);
    --ok: #3fb950; --warn: #d29922; --warn-soft: #2e2509; --err: #f85149; --err-soft: #3a1717;
    --rel-n1: #8b9bb0; --rel-11: #3fb950; --rel-nn: #a371f7;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--f-body); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
h2, h3 { margin: 0; font-size: 14px; font-weight: 600; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--f-mono); font-size: 12px; }
.muted { color: var(--muted); }
.grow { flex: 1; min-width: 0; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }

.btn { height: 28px; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 0 10px; cursor: pointer; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { height: 24px; padding: 0 8px; font-size: 12px; }
.btn.danger { color: var(--err); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.btn.lock svg { display: block; }
.btn.lock.on { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 600; }
.icon { width: 22px; height: 22px; border: 0; background: none; border-radius: 4px; cursor: pointer; color: var(--muted); display: inline-grid; place-items: center; padding: 0; }
.icon:hover { background: var(--surface-2); color: var(--ink); }
.icon.danger:hover { color: var(--err); }
kbd { font: 600 10.5px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--surface-2); }

header { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
/* En édition, le bandeau porte un liseré de la couleur du cadenas ouvert. */
body.editing header { box-shadow: inset 0 -3px 0 var(--warn); }
.brand { display: flex; align-items: center; gap: 7px; font: 700 14px var(--f-mono); letter-spacing: -.01em; }
.brand svg { color: var(--accent); }
.docname { height: 28px; border: 1px solid transparent; border-radius: 5px; background: none; padding: 0 8px; font: 500 12.5px var(--f-mono); width: 24ch; min-width: 0; }
.docname:not(:disabled):hover, .docname:not(:disabled):focus { border-color: var(--line); background: var(--surface); }
.docname:disabled { color: var(--muted); }
.sep { width: 1px; height: 22px; background: var(--line); }
.actions { display: flex; gap: 6px; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
.view { position: relative; min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
.bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 6px 10px; min-height: 40px; border-bottom: 1px solid var(--line); background: var(--surface); }
.bar.tools { background: var(--surface-2); min-height: 36px; padding: 4px 10px; }
.crumb { display: flex; align-items: center; gap: 6px; font: 600 12.5px var(--f-mono); }
.crumb .kind { font: 500 11px var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.count { font: 11.5px var(--f-mono); color: var(--muted); }
select.sm, input.sm { height: 26px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); padding: 0 6px; font-size: 12px; }
input.search { font-family: var(--f-mono); width: 210px; padding-left: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; height: 24px; padding: 0 9px; font-size: 12px; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tool-label { font-size: 11.5px; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); }
.hint b { color: var(--ink); font-weight: 600; }
details.pop { position: relative; }
details.pop > summary { list-style: none; }
details.pop > summary::-webkit-details-marker { display: none; }
details.pop[open] > summary { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.pop-panel { position: absolute; top: calc(100% + 6px); left: 0; z-index: 10; min-width: 230px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, .16); display: grid; gap: 6px; }
.pop-panel label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12.5px; }
.legend-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.legend-row svg { flex: none; }

.canvas { position: relative; overflow: hidden; background-color: var(--canvas); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 20px 20px; }
#graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
#graph.panning { cursor: grabbing; }
.placeholder { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 6px; padding: 24px; color: var(--muted); pointer-events: none; }

/* Graphe */
.hull { fill-opacity: .06; stroke-opacity: .5; stroke-width: 1.2; stroke-dasharray: 5 4; cursor: pointer; }
.hull.focus { fill-opacity: .12; stroke-opacity: .95; stroke-width: 2.2; }
.hull-label { font: 700 11.5px var(--f-mono); letter-spacing: .08em; fill: var(--muted); paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.scene-title { font: 600 16px var(--f-mono); fill: var(--ink); text-anchor: middle; pointer-events: none; }
.edge .line { fill: none; stroke-width: 1.7; }
.edge.rel-nn .line { stroke-width: 2.3; }
.edge.rel-n1 .line { stroke: var(--rel-n1); } .edge.rel-11 .line { stroke: var(--rel-11); } .edge.rel-nn .line { stroke: var(--rel-nn); }
.edge.nullable .line { stroke-dasharray: 6 4; }
.edge .hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.edge:hover .line { stroke-width: 2.8; }
.edge.selected .line { stroke-width: 3.2; }
.m-n1 { fill: var(--rel-n1); } .m-11 { fill: var(--rel-11); } .m-nn { fill: var(--rel-nn); }
.elabel { font: 600 10px var(--f-mono); fill: var(--muted); text-anchor: middle; paint-order: stroke; stroke: var(--canvas); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; }
.node { cursor: pointer; }
.node .card { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.node .head { fill: var(--surface-2); }
.node .rule { stroke: var(--line); stroke-width: 1; }
.node:hover .card { stroke: var(--accent); }
.node.center .card { stroke: var(--accent); stroke-width: 2; }
.node.selected .card { stroke: var(--ink); stroke-width: 2.2; }
.node.drop .card { stroke: var(--accent); stroke-width: 3; }
.node text { font-family: var(--f-mono); }
.node .tname { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
.node .tschema { font-weight: 400; fill: var(--muted); }
.node .ccount { font-size: 10.5px; fill: var(--muted); text-anchor: end; }
.node .cname { font-size: 11px; fill: var(--ink); }
.node .ctype { font-size: 10.5px; fill: var(--muted); text-anchor: end; }
.node .ctag { font-size: 9px; font-weight: 700; fill: var(--muted); }
.node .ctag.pk { fill: var(--accent); }
.node .cmore { font-size: 10.5px; fill: var(--muted); font-style: italic; }
.node.measure { visibility: hidden; pointer-events: none; }
body.editing .node { cursor: crosshair; }
.draft-link { stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: 7 4; fill: none; pointer-events: none; }
.dim { opacity: .13; }

/* Panneau latéral */
aside { border-left: 1px solid var(--line); background: var(--surface); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 6px; }
.tabs button { border: 0; border-bottom: 2px solid transparent; background: none; padding: 10px 10px 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.pane { overflow: auto; overflow-x: hidden; padding: 14px; display: grid; align-content: start; gap: 14px; min-height: 0; }
.pane.src { padding: 0; gap: 0; grid-template-rows: auto minmax(0, 1fr) auto; align-content: stretch; }
.srcbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
textarea.code { width: 100%; height: 100%; border: 0; resize: none; padding: 12px; background: var(--canvas); color: var(--ink); font: 12px/1.55 var(--f-mono); tab-size: 2; white-space: pre; outline: none; }
textarea.code[readonly] { color: var(--muted); }
.src-error { padding: 8px 12px; background: var(--err-soft); color: var(--err); font: 12px var(--f-mono); border-top: 1px solid var(--line); }
.dhead { display: flex; align-items: center; gap: 8px; }
.dhead h2 { font: 700 14px var(--f-mono); overflow-wrap: anywhere; }
.swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; display: inline-block; }
.dactions { display: flex; flex-wrap: wrap; gap: 6px; }
.note { margin: 0; color: var(--muted); white-space: pre-wrap; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 6px; }
.stat { padding: 8px 10px; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { display: block; font: 700 18px var(--f-mono); }
.stat span { font-size: 11px; color: var(--muted); }
table.grid { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
table.grid th:first-child { width: 30px; }
table.grid th:nth-child(2) { width: 52%; }
table.grid td.mono { overflow-wrap: anywhere; }
table.grid td, table.grid th { padding: 4px 6px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
table.grid th { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
table.grid tr.link { cursor: pointer; }
table.grid tr.link:hover td { background: var(--surface-2); }
.tag { font: 700 9.5px var(--f-mono); color: var(--muted); }
.tag.pk { color: var(--accent); }
.flags { font: 10.5px var(--f-mono); color: var(--muted); }
.rel { font: 700 10px var(--f-mono); padding: 1px 5px; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap; }
.rel.n1 { color: var(--rel-n1); } .rel.r11 { color: var(--rel-11); } .rel.nn { color: var(--rel-nn); }
.list { display: grid; gap: 2px; }
.row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 12.5px; }
.row:hover { background: var(--surface-2); }
.row .mono { overflow-wrap: anywhere; }
.issues { margin: 0; padding-left: 18px; color: var(--warn); font-size: 12.5px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12px; color: var(--muted); align-items: center; }
.keys > kbd { justify-self: start; }
.cols input::placeholder { color: var(--muted); opacity: .6; }
.snippet { margin: 0; padding: 8px 10px; background: var(--canvas); border: 1px solid var(--line); border-radius: 5px; font: 11.5px/1.5 var(--f-mono); white-space: pre-wrap; overflow-wrap: anywhere; }

/* Barre d'état */
.statusbar { display: flex; align-items: center; gap: 14px; height: 24px; padding: 0 12px; border-top: 1px solid var(--line); background: var(--surface); font: 11px var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; }
.statusbar .warn { color: var(--warn); }
.statusbar .mode.on { color: var(--warn); font-weight: 700; }

/* Éditeurs */
dialog { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); padding: 0; width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
dialog.narrow { width: min(560px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(8, 12, 18, .5); }
dialog form { display: grid; gap: 14px; padding: 18px 20px; }
dialog h2 { font-size: 15px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 12px; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea, .cols input { height: 28px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); padding: 0 7px; color: var(--ink); font-size: 12.5px; }
.field textarea { height: 56px; padding: 5px 7px; resize: vertical; }
.field .mono, .cols .mono { font-family: var(--f-mono); font-size: 12px; }
.cols-wrap { max-height: 46vh; overflow: auto; border: 1px solid var(--line); border-radius: 5px; }
table.cols { width: 100%; border-collapse: collapse; font-size: 12px; }
table.cols th { position: sticky; top: 0; background: var(--surface-2); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 5px 4px; text-align: left; z-index: 1; }
table.cols td { padding: 3px 4px; border-top: 1px solid var(--line-2); }
table.cols input[type=text] { width: 100%; }
table.cols td.cb { text-align: center; }
.preview { margin: 0; padding: 8px 10px; background: var(--canvas); border: 1px solid var(--line); border-radius: 5px; font: 12px var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
.form-error { color: var(--err); font-size: 12.5px; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; }

.toast { position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 7px 14px; border-radius: 6px; font-size: 12.5px; z-index: 30; }
.toast.err { background: var(--err); color: #fff; }

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 42vh; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .docname { width: 14ch; }
  input.search { width: 150px; }
}
</style>
</head>
<body>
<header>
  <span class="brand">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1" y="2" width="6" height="5" rx="1" fill="currentColor"/><rect x="9" y="9" width="6" height="5" rx="1" fill="currentColor" opacity=".55"/><path d="M7 4.5h3.5v4.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    dbviz
  </span>
  <input id="docname" class="docname" aria-label="Nom du modèle" disabled>
  <span class="grow"></span>
  <button id="lock" class="btn lock" type="button"></button>
  <span class="sep"></span>
  <span id="actions" class="actions"></span>
</header>
<main>
  <section class="view">
    <div class="bar" id="ctxbar"></div>
    <div class="bar tools" id="toolbar"></div>
    <div class="canvas" id="canvas">
      <svg id="graph" role="img" aria-label="Graphe du modèle de données"></svg>
      <div class="placeholder" id="placeholder" hidden></div>
    </div>
  </section>
  <aside>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="pane" id="detail"></div>
    <div class="pane src" id="source" hidden></div>
  </aside>
</main>
<footer class="statusbar" id="status"></footer>
<dialog id="editor"><form id="editorForm" novalidate></form></dialog>
<input type="file" id="file" accept=".dbml,text/plain" hidden>

<script>
'use strict';

/* ---------- Constantes et état ---------- */

const STORE_KEY = 'dbviz.v1';
const EDIT_KEY = 'dbviz.edition';
const MAX_IMPORT = 5 * 1024 * 1024;
const UNDO_MAX = 20;
// Copie de exemples/boutique.dbml, régénérée par `node scripts/sync-exemple.js`.
const SAMPLE = "// Exemple : base d'une boutique en ligne.\n// Sert de jeu de démonstration (bouton « Exemple ») et de modèle pour préparer un import.\n\nProject boutique {\n  database_type: 'PostgreSQL'\n  Note: 'Boutique en ligne : clients, catalogue, commandes et paiements.'\n}\n\nEnum statut_commande {\n  brouillon\n  validee [note: 'Payée, en attente de préparation']\n  expediee\n  livree\n  annulee\n}\n\nTable clients [headercolor: #1f8a9e] {\n  id integer [pk, increment]\n  email varchar(255) [unique, not null]\n  nom varchar(120) [not null]\n  cree_le timestamp [default: `now()`]\n  Note: 'Une ligne par compte client.'\n}\n\nTable adresses {\n  id integer [pk, increment]\n  client_id integer [not null, ref: > clients.id]\n  ligne1 varchar(255) [not null]\n  code_postal varchar(10)\n  ville varchar(120)\n  pays char(2) [default: 'FR']\n}\n\nTable profils {\n  client_id integer [pk]\n  telephone varchar(20)\n  newsletter boolean [default: false]\n}\n\nTable categories {\n  id integer [pk, increment]\n  parent_id integer\n  libelle varchar(120) [not null]\n}\n\nTable produits {\n  id integer [pk, increment]\n  categorie_id integer [not null]\n  reference varchar(30) [unique, not null]\n  libelle varchar(255) [not null]\n  prix_ht decimal(10, 2) [not null]\n  indexes {\n    (categorie_id, libelle)\n    reference [unique, name: 'idx_produits_reference']\n  }\n}\n\nTable fournisseurs {\n  id integer [pk, increment]\n  raison_sociale varchar(255) [not null]\n}\n\nTable commandes {\n  id integer [pk, increment]\n  client_id integer [not null]\n  adresse_livraison_id integer\n  statut statut_commande [not null, default: 'brouillon']\n  passee_le timestamp\n}\n\nTable lignes_commande {\n  commande_id integer [pk]\n  numero smallint [pk]\n  produit_id integer [not null]\n  quantite integer [not null, default: 1]\n  prix_unitaire decimal(10, 2) [not null]\n}\n\nTable paiements {\n  id integer [pk, increment]\n  commande_id integer [not null]\n  montant decimal(10, 2) [not null]\n  moyen varchar(20) [note: 'carte, virement, avoir…']\n}\n\nTableGroup clientele [color: #1f8a9e] {\n  clients\n  adresses\n  profils\n}\n\nTableGroup catalogue [color: #b7791f] {\n  categories\n  produits\n  fournisseurs\n}\n\nTableGroup ventes [color: #8e4bb0] {\n  commandes\n  lignes_commande\n  paiements\n}\n\nRef: profils.client_id - clients.id [delete: cascade]\nRef: categories.parent_id > categories.id\nRef: produits.categorie_id > categories.id\nRef: produits.id <> fournisseurs.id\nRef: commandes.client_id > clients.id\nRef: commandes.adresse_livraison_id > adresses.id [delete: set null]\nRef: lignes_commande.commande_id > commandes.id [delete: cascade]\nRef: lignes_commande.produit_id > produits.id\nRef: paiements.commande_id > commandes.id\n"; // @sample

const SVG_NS = 'http://www.w3.org/2000/svg';
const GROUP_PALETTE = ['#1f8a9e', '#b7791f', '#8e4bb0', '#2f9e5b', '#c2410c', '#4f6d8f', '#b0458f', '#6b7f2a'];
const NEUTRAL = '#8a929c';
// Cardinalités : `>` plusieurs-à-un (la source porte la clé étrangère), `-` un-à-un, `<>` plusieurs-à-plusieurs.
const RELS = {
  '>': { cls: 'n1', badge: 'n1', label: 'N:1', name: 'Plusieurs-à-un' },
  '-': { cls: '11', badge: 'r11', label: '1:1', name: 'Un-à-un' },
  '<>': { cls: 'nn', badge: 'nn', label: 'N:N', name: 'Plusieurs-à-plusieurs' },
};
const ACTIONS = ['', 'cascade', 'restrict', 'set null', 'set default', 'no action'];

let state = emptyModel();
let issues = [];
const ui = {
  edit: false,
  selected: null,       // { type: 'table' | 'ref' | 'group', id }
  focus: null,          // clé de la table au centre (scène « focus table »)
  group: '',            // groupe choisi (scène « focus groupe »)
  schema: '',           // schéma choisi (constellations par groupe)
  labels: 'cols',       // étiquettes des traits : cols | names | none
  cards: 'keys',        // contenu des cartes : keys | all | none
  spread: true,         // graphe éclaté (par défaut) : cartes espacées, croisements réduits, traits qui contournent les cartes
  hideRel: new Set(),   // cardinalités masquées
  hideGroups: new Set(),// groupes masqués ('' = tables sans groupe)
  tab: 'detail',
  srcDraft: null,       // texte DBML en cours de saisie dans l'onglet DBML
  srcError: '',
};

function emptyModel() {
  return { project: null, tables: [], refs: [], enums: [], groups: [], notes: [] };
}

/* ---------- Aides DOM ---------- */

// h() (HTML) et s() (SVG) aplatissent les enfants (tableaux, null ignorés) ; le texte est toujours posé en nœud texte.
function build(el, attrs, children) {
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.setAttribute('class', v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  fill(el, ...children);
  return el;
}
const h = (tag, attrs, ...children) => build(document.createElement(tag), attrs, children);
const s = (tag, attrs, ...children) => build(document.createElementNS(SVG_NS, tag), attrs, children);
function fill(el, ...children) {
  el.textContent = '';
  for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const $ = id => document.getElementById(id);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const plural = (n, word, many = word + 's') => `${n} ${n > 1 ? many : word}`;
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function toast(text, isErr) {
  const t = h('div', { class: 'toast' + (isErr ? ' err' : ''), role: 'status' }, text);
  document.body.append(t);
  setTimeout(() => t.remove(), isErr ? 5000 : 2500);
}

/* ---------- DBML : lecture ---------- */

class DbmlError extends Error {
  constructor(msg, line) { super(line ? `Ligne ${line} : ${msg}` : msg); this.line = line; }
}

function tokenize(src) {
  const toks = [];
  let i = 0, line = 1;
  const push = (type, value, start) => toks.push({ type, value, line, start, end: i });
  while (i < src.length) {
    const c = src[i], start = i;
    if (c === '\n') { i++; push('nl', '\n', start); line++; continue; }
    if (c === ' ' || c === '\t' || c === '\r' || c === '\ufeff') { i++; continue; }
    if (src.startsWith('//', i)) { while (i < src.length && src[i] !== '\n') i++; continue; }
    if (src.startsWith('/*', i)) {
      const e = src.indexOf('*/', i + 2);
      if (e < 0) throw new DbmlError('commentaire /* non fermé', line);
      line += (src.slice(i, e).match(/\n/g) || []).length;
      i = e + 2; continue;
    }
    if (src.startsWith("'''", i)) {
      const e = src.indexOf("'''", i + 3);
      if (e < 0) throw new DbmlError("texte ''' non fermé", line);
      const raw = src.slice(i + 3, e);
      i = e + 3; push('str', dedent(raw), start);
      line += (raw.match(/\n/g) || []).length; continue;
    }
    if (c === "'" || c === '"' || c === '`') {
      let j = i + 1, v = '';
      while (j < src.length && src[j] !== c) {
        if (src[j] === '\n') throw new DbmlError(`chaîne ${c} non fermée`, line);
        if (src[j] === '\\' && j + 1 < src.length) { v += src[j + 1]; j += 2; } else v += src[j++];
      }
      if (j >= src.length) throw new DbmlError(`chaîne ${c} non fermée`, line);
      i = j + 1; push(c === "'" ? 'str' : c === '"' ? 'qid' : 'expr', v, start); continue;
    }
    if (c === '<' && src[i + 1] === '>') { i += 2; push('p', '<>', start); continue; }
    let m;
    if (c === '#' && (m = /^#[0-9a-fA-F]{3,8}\b/.exec(src.slice(i, i + 10)))) { i += m[0].length; push('word', m[0], start); continue; }
    if ((m = /^[\p{L}\p{N}_$]+/u.exec(src.slice(i, i + 256)))) { i += m[0].length; push('word', m[0], start); continue; }
    if ('{}[]():,.<>-~;'.includes(c)) { i++; push('p', c, start); continue; }
    throw new DbmlError(`caractère inattendu « ${c} »`, line);
  }
  toks.push({ type: 'eof', value: '', line, start: i, end: i });
  return toks;
}

// Texte ''' sur plusieurs lignes : retire l'indentation commune et les lignes vides de bord.
function dedent(s) {
  const lines = s.replace(/\r/g, '').split('\n');
  while (lines.length && !lines[0].trim()) lines.shift();
  while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
  const ind = Math.min(...lines.filter(l => l.trim()).map(l => /^\s*/.exec(l)[0].length));
  return lines.map(l => l.slice(Number.isFinite(ind) ? ind : 0)).join('\n');
}

function parseDbml(src) {
  const toks = tokenize(src);
  let p = 0;
  const peek = (o = 0) => toks[p + o];
  const next = () => toks[p++];
  const isP = (v, o = 0) => peek(o).type === 'p' && peek(o).value === v;
  const isW = (v, o = 0) => peek(o).type === 'word' && peek(o).value.toLowerCase() === v;
  const skipNl = () => { while (peek().type === 'nl') p++; };
  const fail = (msg, t = peek()) => { throw new DbmlError(msg, t.line); };
  const expectP = v => { skipNl(); if (!isP(v)) fail(`« ${v} » attendu, « ${peek().value || 'fin du fichier'} » trouvé`); return next(); };
  const ident = () => {
    const t = peek();
    if (t.type !== 'word' && t.type !== 'qid') fail(`nom attendu, « ${t.value || 'fin du fichier'} » trouvé`);
    return next().value;
  };
  const qname = () => { const parts = [ident()]; while (isP('.')) { next(); parts.push(ident()); } return parts; };
  const text = () => { skipNl(); const t = peek(); if (t.type !== 'str') fail('texte entre apostrophes attendu'); return next().value; };

  // Valeur d'un réglage : chaîne, expression `…` ou texte brut (nombre, true, null, #couleur…).
  const value = () => {
    const from = peek();
    if ((from.type === 'str' || from.type === 'expr') && (isP(',', 1) || isP(']', 1))) { next(); return { kind: from.type, v: from.value }; }
    const toksIn = [];
    while (!isP(',') && !isP(']') && peek().type !== 'eof') toksIn.push(next());
    if (!toksIn.length) fail('valeur attendue');
    return { kind: 'raw', v: src.slice(toksIn[0].start, toksIn[toksIn.length - 1].end), toks: toksIn };
  };
  // [clé, clé: valeur, …] → [{key, value}] ; les clés de plusieurs mots (« not null », « primary key ») sont jointes.
  const settings = () => {
    const out = [];
    if (!isP('[')) return out;
    next();
    for (;;) {
      skipNl();
      if (isP(']')) { next(); return out; }
      const words = [];
      while (peek().type === 'word') words.push(next().value.toLowerCase());
      if (!words.length) fail('réglage attendu');
      let val = null;
      if (isP(':')) { next(); skipNl(); val = value(); }
      out.push({ key: words.join(' '), value: val });
      skipNl();
      if (isP(',')) next(); else if (!isP(']')) fail('« , » ou « ] » attendu');
    }
  };
  const settingText = s => (s.value ? s.value.v : '');

  // Extrémité d'une référence : table.colonne ou schema.table.(col1, col2).
  const endpoint = (get) => {
    const parts = [get.ident()];
    let cols = null;
    while (get.isP('.')) {
      get.next();
      if (get.isP('(')) {
        get.next(); cols = [get.ident()];
        while (get.isP(',')) { get.next(); cols.push(get.ident()); }
        if (!get.isP(')')) fail('« ) » attendu');
        get.next(); break;
      }
      parts.push(get.ident());
    }
    if (!cols) { if (parts.length < 2) fail('référence de la forme table.colonne attendue'); cols = [parts.pop()]; }
    return { table: parts.join('.'), columns: cols };
  };
  const mainGet = { ident, isP: v => isP(v), next };
  const REL = ['>', '<', '-', '<>'];
  const relOp = () => { if (peek().type !== 'p' || !REL.includes(peek().value)) fail('relation attendue (>, <, - ou <>)'); return next().value; };

  const model = emptyModel();
  let seq = 0;
  const pendingRefs = [];
  const refSettings = (r, list) => {
    for (const s of list) {
      if (s.key === 'delete') r.onDelete = settingText(s).toLowerCase();
      else if (s.key === 'update') r.onUpdate = settingText(s).toLowerCase();
    }
  };
  const addRef = (name, a, op, b, list, line) => {
    // Normalisation : « < » est retourné en « > », pour que `from` porte toujours la clé étrangère.
    if (op === '<') { [a, b] = [b, a]; op = '>'; }
    const r = { id: 'R' + (++seq), name: name || '', from: a, to: b, rel: op, onDelete: '', onUpdate: '', line };
    refSettings(r, list);
    pendingRefs.push(r);
  };

  function parseTable() {
    const startLine = next().line;
    const parts = qname();
    const t = { id: '', schema: parts.length > 1 ? parts.slice(0, -1).join('.') : '', name: parts[parts.length - 1], alias: '', color: '', note: '', columns: [], indexes: '' };
    if (isW('as')) { next(); t.alias = ident(); }
    for (const s of settings()) {
      if (s.key === 'headercolor') t.color = settingText(s);
      else if (s.key === 'note') t.note = settingText(s);
    }
    expectP('{');
    for (;;) {
      skipNl();
      if (isP('}')) { next(); break; }
      if (peek().type === 'eof') fail(`table ${t.name} non fermée (ouverte ligne ${startLine})`);
      if (isW('note') && (isP(':', 1) || isP('{', 1))) {
        next();
        if (isP(':')) { next(); t.note = text(); } else { next(); t.note = text(); expectP('}'); }
        continue;
      }
      if (isW('indexes') && isP('{', 1)) {
        next(); const open = next();
        let depth = 1;
        while (depth) {
          const k = next();
          if (k.type === 'eof') fail('bloc indexes non fermé', open);
          if (k.type === 'p' && k.value === '{') depth++;
          if (k.type === 'p' && k.value === '}') depth--;
          if (!depth) t.indexes = dedent(src.slice(open.end, k.start));
        }
        continue;
      }
      const line = peek().line;
      const col = { name: ident(), type: '', pk: false, increment: false, notNull: false, unique: false, default: null, note: '' };
      const typeToks = [];
      while (peek().type !== 'nl' && !isP('[') && !isP('}') && peek().type !== 'eof') typeToks.push(next());
      if (!typeToks.length) fail(`type manquant pour la colonne ${col.name}`);
      col.type = src.slice(typeToks[0].start, typeToks[typeToks.length - 1].end);
      for (const s of settings()) {
        if (s.key === 'pk' || s.key === 'primary key') col.pk = true;
        else if (s.key === 'increment') col.increment = true;
        else if (s.key === 'not null') col.notNull = true;
        else if (s.key === 'null') col.notNull = false;
        else if (s.key === 'unique') col.unique = true;
        else if (s.key === 'note') col.note = settingText(s);
        else if (s.key === 'default') col.default = { kind: s.value.kind, v: s.value.v };
        else if (s.key === 'ref') {
          // Référence en ligne (ref: > autre.colonne) : convertie en référence autonome.
          const vt = s.value && s.value.toks;
          if (!vt) fail('référence en ligne invalide');
          let k = 0;
          const get = {
            ident: () => { const x = vt[k]; if (!x || (x.type !== 'word' && x.type !== 'qid')) fail('nom attendu dans ref'); k++; return x.value; },
            isP: v => vt[k] && vt[k].type === 'p' && vt[k].value === v,
            next: () => vt[k++],
          };
          const op = vt[k] && vt[k].type === 'p' && REL.includes(vt[k].value) ? vt[k++].value : fail('relation attendue dans ref');
          const target = endpoint(get);
          addRef('', { table: parts.join('.'), columns: [col.name] }, op, target, [], line);
        }
      }
      t.columns.push(col);
    }
    model.tables.push(t);
  }

  function parseRef() {
    const line = next().line;
    let name = '';
    if (peek().type === 'word' || peek().type === 'qid') name = ident();
    const one = () => {
      skipNl();
      const a = endpoint(mainGet);
      const op = relOp();
      const b = endpoint(mainGet);
      addRef(name, a, op, b, settings(), line);
    };
    if (isP(':')) { next(); one(); }
    else { expectP('{'); one(); expectP('}'); }
  }

  function parseEnum() {
    next();
    const parts = qname();
    const e = { schema: parts.length > 1 ? parts.slice(0, -1).join('.') : '', name: parts[parts.length - 1], values: [] };
    expectP('{');
    for (;;) {
      skipNl();
      if (isP('}')) { next(); break; }
      const v = { name: ident(), note: '' };
      for (const s of settings()) if (s.key === 'note') v.note = settingText(s);
      e.values.push(v);
    }
    model.enums.push(e);
  }

  function parseGroup() {
    next();
    const g = { name: qname().join('.'), color: '', note: '', tables: [] };
    for (const s of settings()) {
      if (s.key === 'color') g.color = settingText(s);
      else if (s.key === 'note') g.note = settingText(s);
    }
    expectP('{');
    for (;;) {
      skipNl();
      if (isP('}')) { next(); break; }
      if (isW('note') && isP(':', 1)) { next(); next(); g.note = text(); continue; }
      g.tables.push(qname().join('.'));
    }
    model.groups.push(g);
  }

  function parseProject() {
    next();
    const pr = { name: '', settings: [], note: '' };
    if (!isP('{')) pr.name = ident();
    expectP('{');
    for (;;) {
      skipNl();
      if (isP('}')) { next(); break; }
      const key = ident();
      if (key.toLowerCase() === 'note' && isP('{')) { next(); pr.note = text(); expectP('}'); continue; }
      if (!isP(':')) fail('« : » attendu');
      next();
      const t = peek();
      if (t.type !== 'str' && t.type !== 'word') fail('valeur attendue');
      next();
      if (key.toLowerCase() === 'note') pr.note = t.value; else pr.settings.push({ key, value: t.value });
    }
    model.project = pr;
  }

  function parseNote() {
    next();
    const n = { name: ident(), text: '' };
    expectP('{'); n.text = text(); expectP('}');
    model.notes.push(n);
  }

  for (;;) {
    skipNl();
    const t = peek();
    if (t.type === 'eof') break;
    if (isW('table')) parseTable();
    else if (isW('ref')) parseRef();
    else if (isW('enum')) parseEnum();
    else if (isW('tablegroup')) parseGroup();
    else if (isW('project')) parseProject();
    else if (isW('note')) parseNote();
    else fail(`bloc inconnu « ${t.value} » (attendu : Project, Table, Ref, Enum, TableGroup, Note)`);
  }

  model.refs = pendingRefs;
  return model;
}

/* ---------- Modèle : contrôle des références ---------- */

// Clé d'une table : « schema.nom », ou « nom » sans schéma.
const tableKey = t => (t.schema ? t.schema + '.' : '') + t.name;

// Point d'entrée unique des données non sûres (stockage, import, exemple) : identifiants posés,
// alias résolus, références pendantes écartées avec un avertissement dans `issues`.
function normalize(m) {
  const out = Object.assign(emptyModel(), m);
  const found = [];
  const byKey = new Map();
  out.tables.forEach((t, i) => {
    t.id = 'T' + (i + 1);
    if (t.color && !/^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(t.color)) { found.push(`Couleur ignorée sur ${tableKey(t)} : ${t.color}`); t.color = ''; }
    for (const k of [tableKey(t), t.alias, !t.schema ? 'public.' + t.name : null]) if (k) byKey.set(k, t);
  });
  const resolve = (end, r) => {
    const t = byKey.get(end.table) || (!end.table.includes('.') ? null : byKey.get(end.table.replace(/^public\./, '')));
    if (!t) { found.push(`Référence ${r.name || ''} ligne ${r.line || '?'} : table inconnue « ${end.table} »`.replace('  ', ' ')); return false; }
    const missing = end.columns.filter(c => !t.columns.some(col => col.name === c));
    if (missing.length) { found.push(`Référence vers ${tableKey(t)} : colonne inconnue « ${missing.join(', ')} »`); return false; }
    end.table = tableKey(t);
    return true;
  };
  out.refs = out.refs.filter(r => resolve(r.from, r) && resolve(r.to, r));
  out.refs.forEach((r, i) => { r.id = 'R' + (i + 1); });
  for (const g of out.groups) {
    if (g.color && !/^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(g.color)) { found.push(`Couleur ignorée sur le groupe ${g.name} : ${g.color}`); g.color = ''; }
    g.tables = g.tables.filter(k => {
      const t = byKey.get(k);
      if (!t) found.push(`Groupe ${g.name} : table inconnue « ${k} »`);
      return !!t;
    }).map(k => tableKey(byKey.get(k)));
  }
  issues = found;
  return out;
}

/* ---------- DBML : écriture ---------- */

const qid = s => (/^[A-Za-z_][A-Za-z0-9_]*$/.test(s) ? s : '"' + s.replace(/["\\]/g, '\\$&') + '"');
const qstr = s => (s.includes('\n') ? "'''\n" + s.replace(/'''/g, "\\'''") + "\n'''" : "'" + s.replace(/['\\]/g, '\\$&') + "'");
const qval = d => (d.kind === 'str' ? qstr(d.v) : d.kind === 'expr' ? '`' + d.v + '`' : d.v);
const qend = e => {
  const t = e.table.split('.').map(qid).join('.');
  return e.columns.length === 1 ? `${t}.${qid(e.columns[0])}` : `${t}.(${e.columns.map(qid).join(', ')})`;
};
const indent = (s, pad) => s.split('\n').map(l => (l ? pad + l : l)).join('\n');

function toDbml(m) {
  const out = [];
  if (m.project) {
    const pr = m.project;
    out.push(`Project ${pr.name ? qid(pr.name) + ' ' : ''}{`);
    for (const s of pr.settings) out.push(`  ${s.key}: ${qstr(s.value)}`);
    if (pr.note) out.push(`  Note: ${qstr(pr.note)}`);
    out.push('}', '');
  }
  for (const e of m.enums) {
    out.push(`Enum ${(e.schema ? qid(e.schema) + '.' : '') + qid(e.name)} {`);
    for (const v of e.values) out.push(`  ${qid(v.name)}${v.note ? ` [note: ${qstr(v.note)}]` : ''}`);
    out.push('}', '');
  }
  for (const t of m.tables) {
    const ts = [];
    if (t.color) ts.push(`headercolor: ${t.color}`);
    out.push(`Table ${(t.schema ? qid(t.schema) + '.' : '') + qid(t.name)}${t.alias ? ' as ' + qid(t.alias) : ''}${ts.length ? ` [${ts.join(', ')}]` : ''} {`);
    for (const c of t.columns) {
      const cs = [];
      if (c.pk) cs.push('pk');
      if (c.increment) cs.push('increment');
      if (c.unique) cs.push('unique');
      if (c.notNull) cs.push('not null');
      if (c.default) cs.push(`default: ${qval(c.default)}`);
      if (c.note) cs.push(`note: ${qstr(c.note)}`);
      out.push(`  ${qid(c.name)} ${c.type}${cs.length ? ` [${cs.join(', ')}]` : ''}`);
    }
    if (t.indexes) out.push('  indexes {', indent(t.indexes, '    '), '  }');
    if (t.note) out.push(`  Note: ${qstr(t.note)}`);
    out.push('}', '');
  }
  for (const g of m.groups) {
    out.push(`TableGroup ${qid(g.name)}${g.color ? ` [color: ${g.color}]` : ''} {`);
    for (const k of g.tables) out.push('  ' + k.split('.').map(qid).join('.'));
    if (g.note) out.push(`  Note: ${qstr(g.note)}`);
    out.push('}', '');
  }
  if (m.refs.length) {
    for (const r of m.refs) {
      const rs = [];
      if (r.onDelete) rs.push(`delete: ${r.onDelete}`);
      if (r.onUpdate) rs.push(`update: ${r.onUpdate}`);
      out.push(`Ref${r.name ? ' ' + qid(r.name) : ''}: ${qend(r.from)} ${r.rel} ${qend(r.to)}${rs.length ? ` [${rs.join(', ')}]` : ''}`);
    }
    out.push('');
  }
  for (const n of m.notes) out.push(`Note ${qid(n.name)} {`, `  ${qstr(n.text)}`, '}', '');
  return out.join('\n').replace(/\n+$/, '\n');
}

/* ---------- Accès au modèle ---------- */

const tableByKey = k => state.tables.find(t => tableKey(t) === k);
const groupByName = name => state.groups.find(g => g.name === name);
const groupOf = key => state.groups.find(g => g.tables.includes(key));
const groupName = key => groupOf(key)?.name || '';
const groupColor = g => (g ? g.color || GROUP_PALETTE[state.groups.indexOf(g) % GROUP_PALETTE.length] : NEUTRAL);
const tableColor = t => { const g = groupOf(tableKey(t)); return g ? groupColor(g) : t.color || NEUTRAL; };
const groupIndex = key => { const i = state.groups.findIndex(g => g.tables.includes(key)); return i < 0 ? 999 : i; };
const tableVisible = key => !ui.hideGroups.has(groupName(key));
const relOf = r => RELS[r.rel] || RELS['>'];
const refById = id => state.refs.find(r => r.id === id);
const refsOf = key => state.refs.filter(r => r.from.table === key || r.to.table === key);
const schemaOf = t => t.schema || 'public';
const schemas = () => [...new Set(state.tables.map(schemaOf))].sort();
const fkColumns = key => new Set(state.refs.filter(r => r.from.table === key).flatMap(r => r.from.columns));
const refText = r => `${qend(r.from)} ${r.rel} ${qend(r.to)}`;
// Clé étrangère facultative (colonnes sources toutes nullables) : trait en tirets.
const refNullable = r => r.rel === '>' && r.from.columns.every(c => {
  const col = tableByKey(r.from.table)?.columns.find(x => x.name === c);
  return col && !col.notNull && !col.pk;
});
const nextId = (prefix, list) => prefix + (list.reduce((m, x) => Math.max(m, parseInt(String(x.id).slice(prefix.length), 10) || 0), 0) + 1);

function visibleRefs() {
  return state.refs.filter(r => !ui.hideRel.has(r.rel) && tableVisible(r.from.table) && tableVisible(r.to.table));
}

/* ---------- Persistance et annulation ---------- */

const undoStack = [];
let lastSaved = '';

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (_) { toast('Enregistrement impossible dans ce navigateur', true); }
}
// Toute modification : muter `state` en place puis commit() (enregistrement, historique, rendu).
function commit() {
  const now = JSON.stringify(state);
  if (now !== lastSaved) {
    undoStack.push(lastSaved);
    if (undoStack.length > UNDO_MAX) undoStack.shift();
    lastSaved = now;
  }
  save();
  renderAll();
}
function undo() {
  if (!ui.edit || !undoStack.length) return;
  state = JSON.parse(undoStack.pop());
  lastSaved = JSON.stringify(state);
  cleanUi();
  save();
  renderAll();
  toast('Modification annulée');
}
// Remplacement complet du modèle (import, exemple, onglet DBML).
function replaceState(m) {
  state = m;
  cleanUi();
  planPos.clear();
  sceneIdentity = null;
  firstFit = true;
  commit();
}
// Retire de l'état d'interface ce qui ne correspond plus au modèle.
function cleanUi() {
  if (ui.focus && !tableByKey(ui.focus)) ui.focus = null;
  if (ui.group && !groupByName(ui.group)) ui.group = '';
  if (ui.schema && !schemas().includes(ui.schema)) ui.schema = '';
  const sel = ui.selected;
  if (sel && !(sel.type === 'table' ? tableByKey(sel.id) : sel.type === 'ref' ? refById(sel.id) : groupByName(sel.id))) ui.selected = null;
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { state = normalize(JSON.parse(raw)); lastSaved = JSON.stringify(state); return; }
  } catch (_) { /* stockage illisible : on repart de l'exemple */ }
  state = SAMPLE ? normalize(parseDbml(SAMPLE)) : emptyModel();
  lastSaved = JSON.stringify(state);
}

try { ui.edit = localStorage.getItem(EDIT_KEY) === '1'; } catch (_) { /* lecture seule */ }
